<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#1f2937;font-size:17px}

<header>
  <h1>Producción de urnas</h1>
  <span id="estado" class="pill">Conectando…</span>

<main id="app"><p>Cargando…</p></main>

<script>
/* ====== Conexión con tu hoja de Google (Apps Script) ======
   Si algún día cambias el enlace de Apps Script, cámbialo solo aquí. */
var API_URL = 'https://script.google.com/macros/s/AKfycbxJx7SON8zk1Cg_Kz1qXxUC-HbdBosEfj27PFDOpbeavj2bDZT6XF52Gx-NRSSadoPF/exec';
var VERSION = '1.6';

function llamarApi(accion, rec){
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 20000);
  var p = accion==='datos'
    ? fetch(API_URL+'?accion=datos&t='+Date.now(), {signal: ctrl&&ctrl.signal})
    : fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                      body: JSON.stringify({accion:accion, rec:rec}), signal: ctrl&&ctrl.signal});
  return p.then(function(r){ return r.text(); })
    .then(function(txt){
      clearTimeout(t);
      var j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('SIN_RED: respuesta no válida (revisa que Apps Script tenga acceso "Cualquier usuario")'); }
      if(!j.ok) throw new Error(j.error||'Error desconocido');
      return accion==='datos' ? j.datos : j;
    }, function(err){ clearTimeout(t); throw new Error('SIN_RED: '+(err&&err.message||err)); });
}
/* Imita google.script.run para que el resto de la app no cambie */
function Runner(){ this.ok=null; this.fail=null; }
Runner.prototype.withSuccessHandler=function(f){ this.ok=f; return this; };
Runner.prototype.withFailureHandler=function(f){ this.fail=f; return this; };
Runner.prototype._go=function(accion,rec){ var me=this;
  llamarApi(accion,rec).then(function(r){ me.ok&&me.ok(r); }, function(e){ me.fail&&me.fail(e); }); };
Runner.prototype.getData=function(){ this._go('datos'); };
Runner.prototype.registrar=function(rec){ this._go('registrar',rec); };
var google={script:{}};
Object.defineProperty(google.script,'run',{get:function(){ return new Runner(); }});

/* Funciona sin internet: guarda la app en el celular */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
/* Cuando sale una versión nueva de la app, se recarga sola (solo si no estás llenando un registro) */
if('serviceWorker' in navigator){
  var teniaVersion=!!navigator.serviceWorker.controller, yaRecargo=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!teniaVersion || yaRecargo) return;
    if(document.getElementById('cant') || document.querySelector('.teclado')) return;
    yaRecargo=true; location.reload();
  });
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }

/* Botón "Instalar app" */
var promptInstalar=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); promptInstalar=e; if(typeof S!=='undefined' && S.nombre && $('app').querySelector('.big')) menu(); });
function esInstalada(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone; }
function esIphone(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function instalar(){
  if(promptInstalar){ promptInstalar.prompt(); promptInstalar.userChoice.then(function(){ promptInstalar=null; menu(); }); return; }
  alert(esIphone() ? 'En Safari toca el botón Compartir (cuadro con flecha) y luego "Agregar a inicio".'
                   : 'Toca los 3 puntos ⋮ del navegador y luego "Instalar app" o "Agregar a pantalla principal".');
}
</script>
<script>
var S = { datos:null, nombre:null, lote:null, pieza:null, papel:false, ultimo:null };
var PIEZAS = [['Wakal','Huacal'],['Tapa','Tapa'],['Centro','Centro'],['Techo','Techo']];

/* ---------- almacenamiento en el celular ---------- */
var MEM = {};
function guardar(k,v){ try{ localStorage.setItem('urnas_'+k, JSON.stringify(v)); }catch(e){ MEM[k]=v; } }
function leer(k,def){ try{ var v=localStorage.getItem('urnas_'+k); return v?JSON.parse(v):def; }catch(e){ return MEM[k]!==undefined?MEM[k]:def; } }
function cola(){ return leer('cola',[]); }
function setCola(c){ guardar('cola',c); pintarEstado(); }

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9); }
function $(id){ return document.getElementById(id); }
function pantalla(html){ S.alCambiar=null; $('app').innerHTML=html; window.scrollTo(0,0); }
function corto(f){ return String(f).replace(/\s*\([^)]*\)\s*$/,''); }
function tagEstado(e){ var k=String(e||'').slice(0,3); return '<span class="tag t-'+esc(k)+'">'+esc(e||'')+'</span>'; }
function ahoraLocal(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }

/* ---------- conexión ---------- */
var enLinea = navigator.onLine;
function pintarEstado(){
  var n=cola().length, el=$('estado');
  if(!enLinea){ el.className='pill off'; el.textContent='Sin internet'+(n?' · '+n+' pendientes':''); }
  else if(n){ el.className='pill pend'; el.textContent=n+' por enviar…'; }
  else { el.className='pill'; el.textContent='En línea'; }
}
function hayScript(){ return typeof google!=='undefined' && google.script && google.script.run; }

function cargarDatos(cb){
  var cache=leer('datos',null);
  if(cache && !S.datos){ S.datos=cache; }
  if(!hayScript()){ enLinea=false; pintarEstado(); cb&&cb(); return; }
  google.script.run
    .withSuccessHandler(function(d){ S.datos=d; guardar('datos',d); enLinea=true; aplicarPendientesALotes(); pintarEstado(); cb&&cb(); })
    .withFailureHandler(function(err){
      enLinea=false; pintarEstado();
      if(!S.datos){ var m=String(err&&err.message||err); document.getElementById('app').innerHTML='<div class="card">'+(/SIN_RED/.test(m)&&!navigator.onLine?'<b>Abre la app una vez con internet</b> para que se descarguen los lotes. Después ya funciona sin señal.<br><br>Mientras tanto usa la <b>hoja de registro en papel</b>.':'<b style="color:#b00020">No pude leer la hoja.</b><br><br>'+esc(m)+'<br><br><small>Mándale una foto de esto a Karlo.</small>')+'<br><br><button class="big b1" onclick="actualizar()">Reintentar</button></div>'; return; }
      cb&&cb();
    })
    .getData();
}

var enviando=false;
function enviarPendientes(){
  if(enviando || !hayScript()) return;
  var c=cola(); if(!c.length){ pintarEstado(); return; }
  enviando=true;
  var rec=c[0];
  google.script.run
    .withSuccessHandler(function(){ var c2=cola().filter(function(r){return r.id!==rec.id;}); setCola(c2); enLinea=true; enviando=false; enviarPendientes(); })
    .withFailureHandler(function(err){
      enviando=false;
      var msg=String(err&&err.message||err);
      if(/cantidad|no válid|No encuentro/i.test(msg)){ /* error de datos: se descarta para no trabar la cola */
        var c3=cola().filter(function(r){return r.id!==rec.id;}); setCola(c3);
        alert('Un registro no se pudo guardar: '+msg);
      } else { enLinea=false; pintarEstado(); }
    })
    .registrar(rec);
}
setInterval(function(){ if(cola().length) enviarPendientes(); }, 30000);
window.addEventListener('online',function(){ enLinea=true; pintarEstado(); enviarPendientes(); cargarDatos(); });
window.addEventListener('offline',function(){ enLinea=false; pintarEstado(); });

/* Mientras no se envían, los registros pendientes adelantan el avance que se muestra */
function aplicarPendientesALotes(){
  if(!S.datos) return;
  cola().forEach(function(r){ if(r.tipo==='avance') avanzarLocal(r.folio,r.pieza,r.fase); });
}
function avanzarLocal(folio,pieza,fase){
  var l=(S.datos.lotes||[]).filter(function(x){return x.folio===folio;})[0];
  if(!l) return;
  var lista=S.datos.fases[pieza]||[];
  if(lista.indexOf(fase) > lista.indexOf(l.av[pieza])) l.av[pieza]=fase;
  if(l.estado==='Sin iniciar') l.estado='En proceso';
}

/* ---------- pantallas ---------- */
/* ---------- contraseña (PIN de 4 números) ---------- */
function sha256(texto){
  var ascii=unescape(encodeURIComponent(texto));
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp=Math.pow, mw=mp(2,32), i, j, res='', words=[], bitLen=ascii.length*8, hash=[], k=[], pc=0, comp={};
  for(var c=2;pc<64;c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/mw)|0); words[words.length]=bitLen;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; res+=((b<16)?0:'')+b.toString(16); }
  return res;
}
function conPin(){ return !!(S.datos && S.datos.claves); }
function esAdmin(){ return conPin() && (S.datos.admins||[]).indexOf(S.nombre)>=0; }
/* ¿La sesión guardada en este celular sigue siendo válida? (si Karlo cambia la contraseña, la vuelve a pedir) */
function sesionValida(){
  if(!conPin()) return true;
  var ses=leer('sesion',null);
  return !!(ses && ses.nombre===S.nombre && ses.ver===S.datos.claves[S.nombre]);
}

function inicio(){
  S.nombre=leer('nombre',null);
  if(!S.datos){ pantalla('<div class="card">No se pudieron cargar los datos. Revisa tu internet y vuelve a abrir la app.<br><br>Mientras tanto usa la <b>hoja de registro en papel</b>.</div>'); return; }
  if(!S.nombre || S.datos.nombres.indexOf(S.nombre)<0 || !sesionValida()) return elegirNombre();
  S.firma=(leer('sesion',{})||{}).firma||null;
  menu();
}

function elegirNombre(){
  var h='<h2>¿Quién eres?</h2><p class="sub">Toca tu nombre</p><div class="grid2">';
  S.datos.nombres.forEach(function(n,i){ h+='<button class="name" onclick="setNombre('+i+')">'+esc(n)+'</button>'; });
  pantalla(h+'</div>');
}
function setNombre(i){
  var n=S.datos.nombres[i];
  if(!conPin()){ S.nombre=n; guardar('nombre',n); menu(); return; }
  if(!S.datos.claves[n]){ pantalla('<div class="card"><b>'+esc(n)+'</b>, todavía no tienes contraseña.<br><br>Pídele a Karlo que te la asigne y luego toca "Actualizar".</div><button class="big b1" onclick="actualizar()">Actualizar</button><button class="big b2" onclick="elegirNombre()">← Volver</button>'); return; }
  S.pinDe=n; S.pin=''; pantallaPin();
}
function pantallaPin(msg){
  var h='<button class="back" onclick="elegirNombre()">← Cambiar nombre</button><h2>Hola, '+esc(S.pinDe)+'</h2><p class="sub">Escribe tu contraseña de 4 números</p>'+
        '<div class="puntos">'+[0,1,2,3].map(function(i){ return '<span class="'+(i<S.pin.length?'on':'')+'"></span>'; }).join('')+'</div>'+
        '<div class="err" style="text-align:center;min-height:20px">'+(msg||'')+'</div><div class="teclado">';
  [1,2,3,4,5,6,7,8,9].forEach(function(d){ h+='<button onclick="tecla(\''+d+'\')">'+d+'</button>'; });
  h+='<span></span><button onclick="tecla(\'0\')">0</button><button onclick="tecla(\'B\')">⌫</button></div>';
  pantalla(h);
}
function tecla(d){
  if(d==='B'){ S.pin=S.pin.slice(0,-1); return pantallaPin(); }
  if(S.pin.length>=4) return;
  S.pin+=d;
  if(S.pin.length<4) return pantallaPin();
  var n=S.pinDe, ver=sha256(n+'|'+S.pin+'|ver');
  if(ver!==S.datos.claves[n]){ S.pin=''; return pantallaPin('Contraseña incorrecta. Intenta otra vez.'); }
  S.nombre=n; S.firma=sha256(n+'|'+S.pin+'|firma'); S.pin='';
  guardar('nombre',n); guardar('sesion',{nombre:n, ver:ver, firma:S.firma});
  menu();
}
function salir(){ guardar('sesion',null); S.firma=null; S.papel=false; elegirNombre(); }
/* En modo hoja de papel, el encargado puede capturar registros de otros */
function quienHtml(){
  if(!esAdmin()) return '';
  var h='<label>¿Quién lo hizo? (de la hoja de papel)</label><select id="quien">';
  S.datos.nombres.forEach(function(n){ h+='<option'+(n===S.nombre?' selected':'')+'>'+esc(n)+'</option>'; });
  return h+'</select>';
}

function menu(){
  var n=cola().length;
  var h='<h2>Hola, '+esc(S.nombre)+(miArea()!=='Todas'?' <span class="tag t-En">'+miArea()+'</span>':'')+'</h2>';
  if(S.papel) h+='<div class="warn"><b>Modo hoja de papel:</b> vas a poder poner la fecha y hora en que se hizo cada registro'+(esAdmin()?' y quién lo hizo':'')+'. <button class="link" onclick="S.papel=false;menu()">Salir de este modo</button></div>';
  if(n) h+='<div class="warn">'+n+' registro(s) guardados en este celular, esperando internet. <button class="link" onclick="enviarPendientes()">Enviar ahora</button></div>';
  h+='<button class="big b1" onclick="lotes()">🔨<span>Avance de un lote<small>Terminé una fase</small></span></button>'+
     '<button class="big b2" onclick="estante()">📦<span>Tomé piezas del estante<small>Saqué piezas para trabajar</small></span></button>'+
     '<button class="big b2" onclick="corte()">🪚<span>Corté piezas<small>Dejé piezas nuevas en el estante</small></span></button>'+
     (S.datos.almacen?'<button class="big b2" onclick="almacen()">🎨<span>Tomé material del almacén<small>Pintura o ferretería</small></span></button>':'')+
     '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:8px">'+
     '<button class="link" onclick="salir()">No soy '+esc(S.nombre)+' (salir)</button>'+

  h+='<div class="ver">Versión '+VERSION+(S.datos&&S.datos.actualizado?' · datos del '+new Date(S.datos.actualizado).toLocaleString('es-MX',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+'</div>';

/* ---------- áreas (Corte / Lijado / Pintura) ---------- */
var AREAS=['Corte','Lijado','Pintura'];
var COLOR_AREA={Corte:'#38761d',Lijado:'#bf9000',Pintura:'#674ea7',Empacado:'#1c4587'};
function miArea(){ var a=(S.datos.areaUsuarios||{})[S.nombre]; return (a && AREAS.indexOf(a)>=0) ? a : 'Todas'; }
function numFase(f){ var n=parseInt(String(f||'').slice(0,2),10); return isNaN(n)?0:n; }
function areaDeFase(pieza,fase){ var e=(S.datos.areasFases||[]).filter(function(x){ return x.pieza===pieza && x.fase===fase; })[0]; return e?e.area:null; }
/* Avance de un lote en cada área (0 a 1), con la última fase registrada de cada pieza */
function avanceLote(l){
  var r={}; AREAS.forEach(function(a){ var tot=0, hec=0;
    (S.datos.areasFases||[]).forEach(function(e){
      if(e.area!==a) return;
      if(e.pieza==='Empacado'){ tot++; hec+=l.cantidad?Math.min(1,(l.empacadas||0)/l.cantidad):0; return; }
      if(e.techo && !l.techo) return;
      tot++; if(e.n<=numFase(l.av[e.pieza])) hec++;
    });
    r[a]=tot?hec/tot:1; });
  return r;
}
function avancePedido(oc){
  var t=0, r={Corte:0,Lijado:0,Pintura:0,Empacado:0};
  S.datos.lotes.forEach(function(l){ if(l.oc!==oc) return; var a=avanceLote(l); t+=l.cantidad;
    AREAS.forEach(function(k){ r[k]+=a[k]*l.cantidad; }); r.Empacado+=Math.min(l.empacadas||0,l.cantidad); });
  if(t) Object.keys(r).forEach(function(k){ r[k]/=t; });
  r.urnas=t; return r;
}
function barrasAvance(){
  if(!S.datos.areasFases) return '';
  var h='', yo=miArea();
  (S.datos.ocs||[]).forEach(function(oc){
    var a=avancePedido(oc); if(!a.urnas) return;
    h+='<div class="card avance"><div class="av-tit">Avance del pedido <b>'+esc(oc)+'</b> · '+a.urnas+' urnas</div>';
    AREAS.concat(['Empacado']).forEach(function(k){
      var p=Math.round(a[k]*100);
      h+='<div class="av-fila'+(k===yo?' yo':'')+'"><span class="av-nom">'+k+(k===yo?' (tu área)':'')+'</span><span class="av-barra"><i style="width:'+p+'%;background:'+COLOR_AREA[k]+'"></i></span><span class="av-pct">'+p+'%</span></div>';
    });
    h+='</div>';
  });
  return h;
}

function lotes(filtro){
  filtro=(filtro||'').toLowerCase();
  var h='<button class="back" onclick="menu()">← Inicio</button>'+
        (S.datos.renglones?'<button class="big b3" onclick="empacado()">📦<span>Empacado<small>Registrar urnas empacadas para entrega</small></span></button>':'')+
        '<h2>¿Qué lote?</h2><p class="sub">Busca el nombre que dice la tarjeta</p>'+
        (miArea()!=='Todas'?'<div class="seg"><button class="'+(S.verTodo?'':'on')+'" onclick="S.verTodo=false;lotes()">Pendientes de '+miArea()+'</button><button class="'+(S.verTodo?'on':'')+'" onclick="S.verTodo=true;lotes()">Todos</button></div>':'')+
        '<input type="text" id="busca" placeholder="Ej. Casita chocolate" value="'+esc(filtro)+'" oninput="filtrarLotes(this.value)">'+
        '<div id="listaLotes" style="margin-top:10px"></div>';
  pantalla(h); filtrarLotes(filtro);
}
function filtrarLotes(f){
  f=norm(f).split(/\s+/).filter(Boolean);
  var grupos={}, orden=[], h='';
  S.datos.lotes.forEach(function(l,i){
    var t=norm(l.folio); if(f.length && !f.every(function(w){ return t.indexOf(w)>=0; })) return;
    if(miArea()!=='Todas' && !S.verTodo && avanceLote(l)[miArea()]>=1) return;
    var k=l.oc+'|'+l.semana; if(!grupos[k]){ grupos[k]=[]; orden.push(k); } grupos[k].push(i);
  });
  orden.sort(function(a,b){ var A=a.split('|'),B=b.split('|'); return A[0]===B[0] ? (Number(A[1])||0)-(Number(B[1])||0) : (A[0]<B[0]?-1:1); });
  var ocAnt=null;
  orden.forEach(function(k){
    var p=k.split('|'), ids=grupos[k], tot=0, emp=0;
    ids.forEach(function(i){ tot+=S.datos.lotes[i].cantidad; emp+=Math.min(S.datos.lotes[i].empacadas||0,S.datos.lotes[i].cantidad); });
    if(p[0]!==ocAnt){ h+='<div class="oc pedido">PEDIDO '+esc(p[0])+'</div>'; ocAnt=p[0]; }
    h+='<div class="oc semana">SEMANA '+esc(p[1])+' <span>· '+tot+' urnas · empacadas '+emp+'</span></div>';
    ids.forEach(function(i){
      var l=S.datos.lotes[i], av=[];
      PIEZAS.forEach(function(pz){ var v=l.av[pz[0]]; if(v && v!=='—' && v!=='No aplica') av.push(pz[1]+': '+v); });
      var al=S.datos.areasFases?avanceLote(l):null;
      h+='<button class="lote" onclick="detalle('+i+')"><b>'+esc(corto(l.folio))+'</b>'+tagEstado(l.estado)+
         '<span>'+l.cantidad+' piezas'+(l.empacadas?' · empacadas '+Math.min(l.empacadas,l.cantidad):'')+'</span><span>'+(av.length?esc(av.join(' · ')):'Sin avance registrado')+'</span>'+
         (al?'<span class="mini">'+AREAS.map(function(k){ return '<em style="color:'+COLOR_AREA[k]+'">'+k+' '+Math.round(al[k]*100)+'%</em>'; }).join(' ')+'</span>':'')+'</button>';
    });
  });
  $('listaLotes').innerHTML = h || (miArea()!=='Todas' && !S.verTodo ? '<div class="card">🎉 No hay lotes pendientes para <b>'+miArea()+'</b>. Toca <b>Todos</b> para ver el resto.</div>' : '<div class="card">No hay lotes con ese nombre. Revisa que el pedido esté <b>Activo</b> o toca "Actualizar datos".</div>');
}

/* ---------- empacado ---------- */
function semanaHoy(oc, fecha){
  var p=(S.datos.pedidos||[]).filter(function(x){ return x.oc===oc; })[0];
  if(!p || !p.inicio) return '';
  var i=new Date(p.inicio), d=fecha?new Date(fecha):new Date();
  var a=Date.UTC(i.getFullYear(),i.getMonth(),i.getDate()), b=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  return Math.max(1, Math.floor(Math.round((b-a)/86400000)/7)+1);
}
function lotesDe(r){
  return S.datos.lotes.filter(function(l){ return l.oc===r.oc && l.modelo===r.modelo && (l.color===r.color || (!r.color && (l.color==='—'||!l.color))); })
    .sort(function(a,b){ var na=+(a.folio.match(/#(\d+)/)||[0,0])[1], nb=+(b.folio.match(/#(\d+)/)||[0,0])[1]; return na-nb; });
}
/* Reparte la cantidad en los lotes del modelo, en orden (#1, #2…) */
function repartir(r, cant){
  var res=[], resto=cant;
  lotesDe(r).forEach(function(l){
    var falta=l.cantidad-Math.min(l.empacadas||0,l.cantidad);
    if(resto<=0 || falta<=0) return;
    var toma=Math.min(falta,resto); res.push({lote:l, toma:toma, falta:falta}); resto-=toma;
  });
  return {partes:res, sobra:resto};
}
function empacado(oc){
  var ocs=(S.datos.ocs||[]); S.ocEmp=oc||S.ocEmp||ocs[0];
  if(ocs.indexOf(S.ocEmp)<0) S.ocEmp=ocs[0];
  var h='<button class="back" onclick="lotes()">← Lotes</button><h2>📦 Empacado</h2><p class="sub">Registra las urnas que empacaste para entregar</p>';
  if(ocs.length>1){ h+='<label>Pedido</label><div class="seg">'; ocs.forEach(function(o){ h+='<button class="'+(o===S.ocEmp?'on':'')+'" onclick="empacado(\''+esc(o)+'\')">'+esc(o)+'</button>'; }); h+='</div>'; }
  var items=(S.datos.renglones||[]).filter(function(r){ return r.oc===S.ocEmp; }).map(function(r,i){
    var falta=Math.max(0,r.aProducir-r.empacadas);
    return {val:r, titulo:r.desc||r.modelo, sub:r.codigo+' · empacadas '+r.empacadas+' de '+r.aProducir+(falta?'':' ✔'), extra:r.modelo+' '+r.color};
  });
  var sem=semanaHoy(S.ocEmp);
  h+='<label>¿Qué modelo empacaste?</label>'+buscador('mod','Escribe: casa, clásica, chocolate…',items)+
     '<label>¿Cuántas empacaste?</label>'+stepper('cant',0)+
     '<div id="pista" class="pista"></div>'+
     (sem?'<div class="sub" style="margin-top:8px">Se entrega en la <b>Semana '+sem+'</b> del pedido '+esc(S.ocEmp)+'</div>':'')+
     '<label>Comentario (opcional)</label><input type="text" id="com" maxlength="200">';
  if(S.papel) h+=quienHtml()+'<label>Fecha y hora (de la hoja de papel)</label><input type="datetime-local" id="fh" value="'+ahoraLocal()+'">';
  h+='<div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarEmpacado()">✔ Registrar</button></div>';
  pantalla(h);
  S.pick.mod.alElegir=function(x){ var rp=repartir(x.val, 1e9); $('cant').value = rp.partes.length ? rp.partes[0].falta : 0; pista(); };
  S.alCambiar=pista; $('cant').oninput=pista;
}
function pista(){
  var x=elegido('mod'), el=$('pista'); if(!el) return;
  if(!x){ el.innerHTML=''; return; }
  var cant=parseInt($('cant').value,10)||0; if(cant<=0){ el.innerHTML=''; return; }
  var rp=repartir(x.val,cant), p=rp.partes, h='';
  if(!p.length) h='<div class="warn">Este modelo ya no tiene lotes pendientes de empacar. Si son extras o reposiciones, escríbelo en el comentario.</div>';
  else {
    var a=p[0], n=a.lote.folio, s=' (Semana '+esc(a.lote.semana)+')';
    if(p.length===1 && a.toma===a.falta) h='<div class="ok-lote">✅ Con esto se completa el lote <b>'+esc(corto(n))+'</b>'+s+'</div>';
    else if(p.length===1) h='<div class="ok-lote parcial">Van para el lote <b>'+esc(corto(n))+'</b>'+s+'. Faltarán <b>'+(a.falta-a.toma)+'</b> para completarlo.</div>';
    else h='<div class="ok-lote">✅ Completa el lote <b>'+esc(corto(n))+'</b>'+s+' y '+p.slice(1).map(function(q){ return '<b>'+q.toma+'</b> van al lote <b>'+esc(corto(q.lote.folio))+'</b> (Semana '+esc(q.lote.semana)+')'; }).join(', ')+'.</div>';
    if(rp.sobra>0) h+='<div class="warn">'+rp.sobra+' son más de lo que falta por empacar de este modelo. Revisa la cantidad.</div>';
  }
  el.innerHTML=h;
}
function guardarEmpacado(){
  var x=elegido('mod'), cant=parseInt($('cant').value,10)||0;
  if(!x){ $('err').textContent='Elige el modelo que empacaste.'; return; }
  if(cant<=0){ $('err').textContent='Escribe cuántas empacaste (más de 0).'; return; }
  var r=x.val, rp=repartir(r,cant);
  if(rp.sobra>0 && !confirm('Pusiste '+cant+' pero solo faltan '+(cant-rp.sobra)+' por empacar de este modelo. ¿Registrar de todos modos?')) return;
  var fecha=fechaRegistro();
  var rec={ id:uid(), tipo:'empacado', nombre:S.nombre, ts:fecha, oc:r.oc, codigo:r.codigo, desc:r.desc, cantidad:cant,
            lote:rp.partes.map(function(q){ return q.lote.folio; }).join(', '), semana:semanaHoy(r.oc,fecha), comentario:$('com').value.trim() };
  r.empacadas+=cant; rp.partes.forEach(function(q){ q.lote.empacadas=(q.lote.empacadas||0)+q.toma; if(q.lote.empacadas>=q.lote.cantidad) q.lote.estado='Terminado'; });
  guardar('datos',S.datos);
  encolar(rec, (r.desc||r.modelo)+' · '+cant+' empacadas'+(rec.semana?' · Semana '+rec.semana:''), 'empacado');
}

/* Fases que aplican a este lote (sin las de techo si el modelo no lleva techo) */
function fasesDe(l,pieza){
  var lista=S.datos.fases[pieza]||[];
  if(pieza==='Wakal' && !l.techo) lista=lista.filter(function(f){ return !/techo/i.test(f); });
  if(S.datos.faseEmpaque) lista=lista.filter(function(f){ return f!==S.datos.faseEmpaque; });
  if(miArea()!=='Todas' && !S.verFases && S.datos.areasFases){ var a=miArea(); var sol=lista.filter(function(f){ var x=areaDeFase(pieza,f); return !x || x===a; }); if(sol.length) lista=sol; }
  return lista;
}
function sugerida(l,pieza){
  var todas=S.datos.fases[pieza]||[], lista=fasesDe(l,pieza), act=todas.indexOf(l.av[pieza]);
  if(act<0) return lista[0];
  for(var k=0;k<lista.length;k++){ if(todas.indexOf(lista[k])>act) return lista[k]; }
  return lista[lista.length-1];
}

function detalle(i,pieza){
  S.lote=S.datos.lotes[i]; var l=S.lote;
  var piezasOk=PIEZAS.filter(function(p){ if(p[0]==='Techo' && !l.techo) return false;
    if(miArea()==='Todas' || S.verFases || !S.datos.areasFases) return true;
    return (S.datos.fases[p[0]]||[]).some(function(f){ return areaDeFase(p[0],f)===miArea(); }); });
  if(!piezasOk.length) piezasOk=PIEZAS.filter(function(p){ return !(p[0]==='Techo' && !l.techo); });
  S.pieza=pieza||S.pieza||piezasOk[0][0];
  if(!piezasOk.some(function(p){ return p[0]===S.pieza; })) S.pieza=piezasOk[0][0];
  var h='<button class="back" onclick="lotes()">← Lotes</button><h2>'+esc(corto(l.folio))+'</h2><p class="sub">'+l.cantidad+' piezas · pedido '+esc(l.oc)+'</p>';
  h+='<label>¿Qué pieza?</label><div class="seg">';
  piezasOk.forEach(function(p){
    h+='<button class="'+(S.pieza===p[0]?'on':'')+'" onclick="detalle('+i+',\''+p[0]+'\')">'+p[1]+'</button>';
  });
  h+='</div>';
  var lista=fasesDe(l,S.pieza), sug=sugerida(l,S.pieza), act=l.av[S.pieza];
  h+='<label>Fase que terminaste</label><select id="fase">';
  lista.forEach(function(f){ h+='<option'+(f===sug?' selected':'')+'>'+esc(f)+'</option>'; });
  h+='</select><div class="sug">Va en: '+esc(act&&act!=='—'?act:'sin iniciar')+' → sugerida la siguiente</div>';
  if(miArea()!=='Todas' && S.datos.areasFases) h+='<button class="link" onclick="S.verFases=!S.verFases;detalle('+i+')">'+(S.verFases?'Ver solo fases de '+miArea():'Ver todas las fases')+'</button>';
  h+='<label>¿Cuántas piezas pasaron?</label>'+stepper('cant',l.cantidad);
  h+='<label>¿Se dañó alguna?</label>'+stepper('dan',0);
  h+='<label>Comentario (opcional)</label><input type="text" id="com" maxlength="200">';
  if(S.papel) h+=quienHtml()+'<label>Fecha y hora en que se hizo (de la hoja de papel)</label><input type="datetime-local" id="fh" value="'+ahoraLocal()+'">';
  h+='<div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarAvance()">✔ Registrar</button></div>';
  pantalla(h);
}
function stepper(id,v){
  return '<div class="step"><button onclick="paso(\''+id+'\',-1)">−</button><input type="number" inputmode="decimal" step="any" id="'+id+'" value="'+v+'" min="0"><button onclick="paso(\''+id+'\',1)">+</button></div>';
}
function paso(id,d){ var e=$(id); e.value=Math.max(0,Math.round(((parseFloat(e.value)||0)+d)*100)/100); if(S.alCambiar) S.alCambiar(); }
function fechaRegistro(){
  if(S.papel && $('fh') && $('fh').value) return new Date($('fh').value).toISOString();
  return new Date().toISOString();
}

function guardarAvance(){
  var cant=parseInt($('cant').value,10)||0, dan=parseInt($('dan').value,10)||0;
  if(cant<=0){ $('err').textContent='Escribe cuántas piezas pasaron (más de 0).'; return; }
  if(cant>S.lote.cantidad*2){ if(!confirm('¿Seguro? Pusiste '+cant+' y el lote es de '+S.lote.cantidad+'.')) return; }
  var rec={ id:uid(), tipo:'avance', nombre:S.nombre, ts:fechaRegistro(), folio:S.lote.folio, pieza:S.pieza,
            fase:$('fase').value, cantidad:cant, danadas:dan, comentario:$('com').value.trim() };
  encolar(rec, corto(S.lote.folio)+' · '+rec.fase, 'avance');
}

/* ---------- buscador de material/piezas (busca escribiendo o abre la lista completa) ---------- */
var NIVEL={ 'CRÍTICO':['rojo','🔴','Queda poco'], 'POR AGOTARSE':['amarillo','🟡','Ya casi se acaba'], 'ESTABLE':['verde','🟢','Hay suficiente'] };
var NIVEL_EST={ 'CORTAR YA':['rojo','🔴','Hay que cortar ya'], 'CORTAR PRONTO':['amarillo','🟡','Cortar pronto'], 'OK':['verde','🟢','Hay suficiente'] };
function norm(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
/* items: [{val, titulo, sub, nivel:[color,icono,texto], queda}] */
function buscador(id, placeholder, items){
  S.pick=S.pick||{}; S.pick[id]={items:items, sel:null, todos:false};
  return '<div id="'+id+'_buscar"><input type="text" id="'+id+'_q" placeholder="'+esc(placeholder)+'" oninput="pintarOpciones(\''+id+'\')" autocomplete="off">'+
         '<div id="'+id+'_res" style="margin-top:8px"></div>'+
         '<button class="link" id="'+id+'_todos" onclick="verTodos(\''+id+'\')">Ver toda la lista ▾</button></div>'+
         '<div id="'+id+'_sel"></div>';
}
function opcionHtml(id,x,i){
  var n=x.nivel;
  return '<button class="lote opc'+(n?' n-'+n[0]:'')+'" onclick="elegir(\''+id+'\','+i+')"><b>'+(n?n[1]+' ':'')+esc(x.titulo)+'</b>'+(x.sub?'<span>'+esc(x.sub)+'</span>':'')+'</button>';
}
function pintarOpciones(id){
  var P=S.pick[id], q=norm($(id+'_q').value).split(/\s+/).filter(Boolean), h='', n=0;
  if(q.length){
    P.items.forEach(function(x,i){ var t=norm(x.titulo+' '+(x.sub||'')+' '+(x.extra||'')); if(q.every(function(w){return t.indexOf(w)>=0;})){ if(n<8) h+=opcionHtml(id,x,i); n++; } });
    if(!n) h='<div class="card">No encontré nada con ese nombre. Toca <b>Ver toda la lista</b>.</div>';

  }

  $(id+'_todos').textContent = P.todos&&!q.length ? 'Ocultar lista ▴' : 'Ver toda la lista ▾';
}
function verTodos(id){ var P=S.pick[id]; P.todos=!P.todos; $(id+'_q').value=''; pintarOpciones(id); }
function elegir(id,i){

function cambiar(id){ S.pick[id].sel=null; if($('pista')) $('pista').innerHTML=''; $(id+'_sel').innerHTML=''; $(id+'_buscar').className=''; $(id+'_q').focus&&$(id+'_q').focus(); pintarOpciones(id); }
function elegido(id){ var P=S.pick&&S.pick[id]; return P&&P.sel!=null ? P.items[P.sel] : null; }

function estante(){
  var info=S.datos.estante||{};
  var items=(S.datos.piezasEstante||[]).map(function(t){ var p=t.split(' · '), e=info[t];
    return {val:t, titulo:p[0], sub:[p.slice(1).join(' · '), e?'hay '+e.existencia+(e.min?' (mínimo '+e.min+')':''):''].filter(Boolean).join(' · '), extra:p.slice(1).join(' '), nivel:e?NIVEL_EST[e.estado]:null, queda:e?e.existencia+' piezas':null}; });
  var h='<button class="back" onclick="menu()">← Inicio</button><h2>Tomé piezas del estante</h2>'+
        '<label>¿Qué pieza?</label>'+buscador('pz','Escribe: wakal, tapa, casita…',items)+
        (Object.keys(info).length?'<div class="sub" style="margin-top:6px">🟢 hay suficiente · 🟡 cortar pronto · 🔴 hay que cortar ya</div>':'')+
        '<label>¿Cuántas?</label>'+stepper('cant',0);
  if(S.papel) h+=quienHtml()+'<label>Fecha y hora (de la hoja de papel)</label><input type="datetime-local" id="fh" value="'+ahoraLocal()+'">';
  h+='<div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarEstante()">✔ Registrar</button></div>';
  pantalla(h);
}
function guardarEstante(){
  var x=elegido('pz'), cant=parseInt($('cant').value,10)||0;
  if(!x){ $('err').textContent='Elige la pieza que tomaste.'; return; }
  if(cant<=0){ $('err').textContent='Escribe cuántas tomaste (más de 0).'; return; }
  var e=(S.datos.estante||{})[x.val]; if(e){ e.existencia-=cant; if(e.existencia<=0) e.estado='CORTAR YA'; guardar('datos',S.datos); }
  encolar({ id:uid(), tipo:'estante', nombre:S.nombre, ts:fechaRegistro(), piezaEstante:x.val, cantidad:cant }, x.val+' · '+cant+' piezas', 'estante');
}

function corte(){
  var info=S.datos.estante||{};
  var items=(S.datos.piezasCorte||[]).map(function(x){ var e=info[x.codigo+' · '+x.usado];
    return {val:x.codigo, titulo:x.codigo, sub:x.usado+(e?' · hay '+e.existencia:''), extra:x.usado, nivel:e?NIVEL_EST[e.estado]:null, queda:e?e.existencia+' piezas':null}; });
  var h='<button class="back" onclick="menu()">← Inicio</button><h2>Corté piezas</h2><p class="sub">Piezas nuevas que dejaste en el estante</p>'+
        '<label>¿Qué pieza?</label>'+buscador('pc','Escribe: wakal, tapa, casita…',items)+
        (Object.keys(info).length?'<div class="sub" style="margin-top:6px">🔴 = hay que cortar ya · 🟡 = cortar pronto · 🟢 = hay suficiente</div>':'')+
        '<label>¿Cuántas piezas?</label>'+stepper('cant',0)+
        '<label>Hojas de MDF que usaste (opcional)</label>'+stepper('hojas',0)+
        '<label>¿Para qué pedido? (opcional)</label><select id="oc"><option value=""></option>';
  (S.datos.ocs||[]).forEach(function(o){ h+='<option>'+esc(o)+'</option>'; });
  h+='</select>';
  if(S.papel) h+=quienHtml()+'<label>Fecha y hora (de la hoja de papel)</label><input type="datetime-local" id="fh" value="'+ahoraLocal()+'">';
  h+='<div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarCorte()">✔ Registrar</button></div>';
  pantalla(h);
}
function guardarCorte(){
  var x=elegido('pc'), cant=parseInt($('cant').value,10)||0, hojas=parseInt($('hojas').value,10)||0;
  if(!x){ $('err').textContent='Elige la pieza que cortaste.'; return; }
  if(cant<=0){ $('err').textContent='Escribe cuántas piezas cortaste (más de 0).'; return; }
  encolar({ id:uid(), tipo:'corte', nombre:S.nombre, ts:fechaRegistro(), piezaCorte:x.val, cantidad:cant, hojas:hojas||'', oc:$('oc').value }, x.val+' · '+cant+' piezas', 'corte');
}

/* ---------- almacén (pintura y ferretería) ---------- */
function articulos(){ return (S.datos.almacen&&S.datos.almacen[S.area])||[]; }
function almacen(area){
  S.area=area||S.area||'Pintura';
  var items=articulos().map(function(x,i){ return {val:i, titulo:x.nombre, sub:'Quedan '+x.existencia+' '+x.unidad, extra:x.codigo, nivel:NIVEL[x.estado], queda:x.existencia+' '+x.unidad}; });
  var h='<button class="back" onclick="menu()">← Inicio</button><h2>Tomé material del almacén</h2><div class="seg">';
  ['Pintura','Ferretería'].forEach(function(a){ h+='<button class="'+(S.area===a?'on':'')+'" onclick="almacen(\''+a+'\')">'+(a==='Pintura'?'🎨 ':'🔩 ')+a+'</button>'; });
  h+='</div><label>¿Qué material?</label>'+buscador('art','Escribe: laca, lija, thinner…',items)+
     '<div class="sub" style="margin-top:6px">🟢 hay suficiente · 🟡 ya casi se acaba · 🔴 queda poco</div>'+
     '<label>¿Cuánto tomaste?</label>'+stepper('cant',1)+
     '<label>¿Para qué? (opcional)</label><input type="text" id="uso" maxlength="120" placeholder="Ej. pedido OC1655, casitas chocolate">';
  if(S.papel) h+=quienHtml()+'<label>Fecha y hora (de la hoja de papel)</label><input type="datetime-local" id="fh" value="'+ahoraLocal()+'">';
  h+='<div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarAlmacen()">✔ Registrar</button></div>';
  pantalla(h);
}
function guardarAlmacen(){
  var sel=elegido('art'), x=sel?articulos()[sel.val]:null, cant=parseFloat($('cant').value)||0;
  if(!x){ $('err').textContent='Elige el material que tomaste.'; return; }
  if(cant<=0){ $('err').textContent='Escribe cuánto tomaste (más de 0).'; return; }
  if(cant>x.existencia && x.existencia>0 && !confirm('En el sistema solo quedan '+x.existencia+' '+x.unidad+'. ¿Seguro que tomaste '+cant+'?')) return;
  x.existencia=Math.round((x.existencia-cant)*100)/100;
  if(x.min!=null && x.alerta!=null) x.estado = x.existencia<=x.min ? 'CRÍTICO' : (x.existencia<=x.alerta ? 'POR AGOTARSE' : 'ESTABLE');
  guardar('datos',S.datos);
  encolar({ id:uid(), tipo:'almacen', nombre:S.nombre, ts:fechaRegistro(), area:S.area, articulo:x.op, cantidad:cant, uso:$('uso').value.trim() },
          x.nombre+' · '+cant+' '+x.unidad, 'almacen');
}

/* Todo registro pasa primero por el celular: si no hay internet, ahí se queda hasta que se pueda enviar */
function encolar(rec, resumen, tipo){
  if(S.papel && $('quien') && $('quien').value && $('quien').value!==S.nombre){ rec.capturo=S.nombre; rec.nombre=$('quien').value; resumen=rec.nombre+' · '+resumen; }
  if(S.firma) rec.firma=S.firma;
  var c=cola(); c.push(rec); setCola(c);
  if(rec.tipo==='avance') avanzarLocal(rec.folio,rec.pieza,rec.fase);
  S.ultimo=tipo;
  pantalla('<div class="ok"><div class="icon">⏳</div><h2>Enviando…</h2><p class="sub">'+esc(resumen)+'</p></div>');
  if(!hayScript()){ confirmar(false,resumen); return; }
  google.script.run
    .withSuccessHandler(function(){ setCola(cola().filter(function(r){return r.id!==rec.id;})); enLinea=true; pintarEstado(); confirmar(true,resumen); enviarPendientes(); })
    .withFailureHandler(function(err){
      var msg=String(err&&err.message||err);
      if(/cantidad|no válid|No encuentro/i.test(msg)){ setCola(cola().filter(function(r){return r.id!==rec.id;})); pantalla('<div class="card err">No se guardó: '+esc(msg)+'</div><button class="big b2" onclick="menu()">Volver</button>'); return; }
      enLinea=false; pintarEstado(); confirmar(false,resumen);
    })
    .registrar(rec);
}
function confirmar(enviado,resumen){
  var h='<div class="ok"><div class="icon">'+(enviado?'✅':'📱')+'</div><h2>'+(enviado?'¡Listo, registrado!':'Guardado en tu celular')+'</h2>'+
        '<p class="sub">'+esc(resumen)+'</p>'+
        (enviado?'':'<div class="warn">No hay internet. Se va a enviar solo cuando regrese la señal. <b>No lo vuelvas a capturar.</b></div>')+'</div>';
  var i=S.lote?S.datos.lotes.map(function(x){return x.folio;}).indexOf(S.lote.folio):-1;
  if(S.ultimo==='avance' && i>=0){ h+='<button class="big b1" onclick="detalle('+i+')">Registrar otra fase de este lote</button><button class="big b2" onclick="lotes()">Otro lote</button>'; }
  else if(S.ultimo==='estante'){ h+='<button class="big b1" onclick="estante()">Tomé otra pieza</button>'; }
  else if(S.ultimo==='corte'){ h+='<button class="big b1" onclick="corte()">Corté otra pieza</button>'; }
  else if(S.ultimo==='empacado'){ h+='<button class="big b1" onclick="empacado()">Registrar otro empacado</button>'; }
  else if(S.ultimo==='almacen'){ h+='<button class="big b1" onclick="almacen()">Tomé otro material</button>'; }
  h+='<button class="big b2" onclick="menu()">Inicio</button>';
  pantalla(h);
}

/* ---------- arranque ---------- */
pintarEstado();
cargarDatos(function(){ inicio(); enviarPendientes(); });
</script>
