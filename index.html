  /* Colores: azul = navegar y elegir; naranja = registrar/confirmar; gris y blanco = fondo.
     Verde solo para "terminado/enviado" y rojo solo para "atrasado/error". */
  :root{--bg:#EEF2F6;--card:#FFFFFF;--card2:#F4F6F9;--line:#CDD6E0;--tx:#16263A;--mu:#566575;
    --y:#1F5FA8;--yx:#1F5FA8;--yt:#FFFFFF;--azS:#E5EEF9;--nar:#D45F10;--narS:#FFF1E4;
    --ok:#1D7748;--okbg:#E1F2E8;--red:#BE3326;--redbg:#FBE5E2;--wbg:#FFF1E4;--wtx:#7A3608;--vacio:#E0E6ED;--amar:#E9B800;--amartx:#7A5D00;
    --a-Corte:#7C8B9D;--a-Lijado:#E8892B;--a-Pintura:#2F74C0;--a-Empacado:#15304F}
  body.oscuro{--bg:#0F1A27;--card:#182637;--card2:#1F3045;--line:#2E415A;--tx:#EEF2F6;--mu:#A2B2C3;
    --y:#3A7DD6;--yx:#7DB1F0;--yt:#FFFFFF;--azS:#1C3554;--nar:#E8701F;--narS:#3A2414;
    --ok:#5FCF8F;--okbg:#14301F;--red:#FF7B6E;--redbg:#3B1A17;--wbg:#3A2414;--wtx:#FFC28F;--vacio:#2E415A;--amar:#F5C518;--amartx:#F5C518;
    --a-Corte:#A6B4C4;--a-Lijado:#F2913D;--a-Pintura:#62A0EC;--a-Empacado:#DCE5EF}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Legible',Roboto,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;line-height:1.45;letter-spacing:.15px;-webkit-tap-highlight-color:transparent}
  svg.ic{flex:none;display:block}
  b,strong{font-weight:700}
  header{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top));z-index:5;background:#15304F;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
  header h1{font-size:21px;font-weight:700;letter-spacing:1.5px;line-height:1;margin:0;flex:1;color:#fff}
  header h1:after{content:'';display:block;width:30px;height:4px;border-radius:2px;background:#F28C28;margin-top:5px}
  .pill{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);color:#9FE2B9;white-space:nowrap}
  .pill:before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor}
  .pill.off{color:#FFB0A8}.pill.pend{color:#FFC48F}
  main{padding:18px 16px 28px;max-width:560px;margin:0 auto}
  h2{font-size:27px;font-weight:700;line-height:1.2;letter-spacing:.2px;margin:6px 0 14px}
  h3{font-weight:700;letter-spacing:.2px}
  .sub{color:var(--mu);font-size:15px;line-height:1.5;margin:-6px 0 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{font:inherit;color:inherit;letter-spacing:inherit;border:0;border-radius:10px;cursor:pointer;background:none}
  button:active{transform:scale(.98)}
  .big{width:100%;min-height:64px;padding:14px 16px;font-size:18px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:14px;text-align:left;line-height:1.3}
  .big small{display:block;font-weight:400;font-size:15px;opacity:.9;margin-top:3px}
  .b1{background:var(--y);color:var(--yt)}
  .b3{background:var(--nar);color:#fff}
  .b2{background:var(--card);color:var(--tx);border:2px solid var(--line)}
  .b4{background:var(--card);color:var(--tx);border:2px dashed var(--y)}
  .bR{background:var(--red);color:#fff}
  /* inicio */
  .hola{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 16px}
  .hola h2{margin:0;font-size:32px;line-height:1.1}
  .hola .area{text-align:right;font-size:14px;color:var(--mu)}
  .hola .area b{display:block;font-size:20px;color:var(--yx);line-height:1.2}
  .hero{width:100%;min-height:118px;background:var(--y);color:#fff;border-radius:14px;padding:18px;display:flex;align-items:center;gap:16px;text-align:left;margin-bottom:12px}
  .hero b,.hero small{display:block}
  .hero b{font-size:26px;line-height:1.2}
  .hero small{font-size:16px;margin-top:4px;opacity:.92}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

var enLinea = navigator.onLine;
function pintarEstado(){
  var n=cola().length, el=$('estado');
  if(!enLinea){ el.className='pill off'; el.textContent='Sin internet'+(n?' · '+n+' pendientes':''); }
  else if(n){ el.className='pill pend'; el.textContent=n+' por enviar…'; }
  else { el.className='pill'; el.textContent='En línea'; }
}
function hayScript(){ return typeof google!=='undefined' && google.script && google.script.run; }

function cargarDatos(cb){
  var cache=leer('datos',null);
  if(cache && !S.datos){ S.datos=cache; }
  if(!hayScript()){ enLinea=false; pintarEstado(); cb&&cb(); return; }
  google.script.run
    .withSuccessHandler(function(d){ S.datos=d; guardar('datos',d); enLinea=true; aplicarPendientesALotes(); pintarEstado(); cb&&cb(); })
    .withFailureHandler(function(err){
      enLinea=false; pintarEstado();
      if(!S.datos){ var m=String(err&&err.message||err); document.getElementById('app').innerHTML='<div class="card">'+(/SIN_RED/.test(m)&&!navigator.onLine?'<b>Abre la app una vez con internet</b> para que se descarguen los lotes. Después ya funciona sin señal.<br><br>Mientras tanto usa la <b>hoja de registro en papel</b>.':'<b style="color:var(--red)">No pude leer la hoja.</b><br><br>'+esc(m)+'<br><br><small>Mándale una foto de esto a Karlo.</small>')+'<br><br><button class="big b1" onclick="actualizar()">Reintentar</button></div>'; return; }
      cb&&cb();
    })
    .getData();
}

var enviando=false;
function enviarPendientes(){
  if(enviando || !hayScript()) return;
  var c=cola(); if(!c.length){ pintarEstado(); return; }
  enviando=true;
  var rec=c[0];
  google.script.run
    .withSuccessHandler(function(){ var c2=cola().filter(function(r){return r.id!==rec.id;}); setCola(c2); histMarcar(rec.id,'enviado'); enLinea=true; enviando=false; enviarPendientes(); })
    .withFailureHandler(function(err){
      enviando=false;
      var msg=String(err&&err.message||err);
      if(/cantidad|no válid|No encuentro/i.test(msg)){ /* error de datos: se descarta para no trabar la cola */
        var c3=cola().filter(function(r){return r.id!==rec.id;}); setCola(c3); histMarcar(rec.id,'rechazado');
        alert('Un registro no se pudo guardar: '+msg);
      } else { enLinea=false; pintarEstado(); }
    })
    .registrar(rec);
}
setInterval(function(){ if(cola().length) enviarPendientes(); }, 30000);
window.addEventListener('online',function(){ enLinea=true; pintarEstado(); enviarPendientes(); cargarDatos(); });

function aplicarPendientesALotes(){
  if(!S.datos) return;
  cola().forEach(function(r){ if(r.tipo==='avance') (r.items||[{pieza:r.pieza,fase:r.fase}]).forEach(function(x){ avanzarLocal(r.folio,x.pieza,x.fase); sumarHecho(r.folio,x.pieza,x.fase,Number(r.cantidad)||0); }); });
}
function avanzarLocal(folio,pieza,fase){
  var l=(S.datos.lotes||[]).filter(function(x){return x.folio===folio;})[0];
  if(!l) return;
  var lista=S.datos.fases[pieza]||[];
  if(lista.indexOf(fase) > lista.indexOf(l.av[pieza])) l.av[pieza]=fase;
  if(l.estado==='Sin iniciar') l.estado='En proceso';
}

function sha256(texto){
  var ascii=unescape(encodeURIComponent(texto));
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp=Math.pow, mw=mp(2,32), i, j, res='', words=[], bitLen=ascii.length*8, hash=[], k=[], pc=0, comp={};
  for(var c=2;pc<64;c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/mw)|0); words[words.length]=bitLen;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; res+=((b<16)?0:'')+b.toString(16); }
  return res;
}
function conPin(){ return !!(S.datos && S.datos.claves); }

}

  S.pinDe=n; S.pin=''; pantallaPin();
}
function pantallaPin(msg){
  var h='<button class="back" onclick="elegirNombre()">'+ic('back',18,0,3)+'Cambiar nombre</button><h2>Hola, '+esc(S.pinDe)+'</h2><p class="sub">Escribe tu contraseña de 4 números</p>'+
        '<div class="puntos">'+[0,1,2,3].map(function(i){ return '<span class="'+(i<S.pin.length?'on':'')+'"></span>'; }).join('')+'</div>'+
        '<div class="err" style="text-align:center;min-height:20px">'+(msg||'')+'</div><div class="teclado">';
  [1,2,3,4,5,6,7,8,9].forEach(function(d){ h+='<button onclick="tecla(\''+d+'\')">'+d+'</button>'; });
  h+='<span></span><button onclick="tecla(\'0\')">0</button><button onclick="tecla(\'B\')">⌫</button></div>';
  pantalla(h);

function tecla(d){
  if(d==='B'){ S.pin=S.pin.slice(0,-1); return pantallaPin(); }
  if(S.pin.length>=4) return;
  S.pin+=d;
  if(S.pin.length<4) return pantallaPin();
  var n=S.pinDe, ver=sha256(n+'|'+S.pin+'|ver');
  if(ver!==S.datos.claves[n]){ S.pin=''; return pantallaPin('Contraseña incorrecta. Intenta otra vez.'); }
  S.nombre=n; S.firma=sha256(n+'|'+S.pin+'|firma'); S.pin='';
  guardar('nombre',n); guardar('sesion',{nombre:n, ver:ver, firma:S.firma});
  menu();
}
function salir(){ guardar('sesion',null); S.firma=null; S.papel=false; elegirNombre(); }

/* ---------- áreas (Corte / Lijado / Pintura) ---------- */
var AREAS=['Corte','Lijado','Pintura'];
var COLOR_AREA={Corte:'var(--a-Corte)',Lijado:'var(--a-Lijado)',Pintura:'var(--a-Pintura)',Empacado:'var(--a-Empacado)'};
/* Barras de avance: una barra separada por área, con su nombre */
function barrasAreas(a, pct, areas){
  areas=areas||AREAS.concat(['Empacado']);
  return '<div class="barras"'+(areas.length<4?' style="grid-template-columns:repeat('+areas.length+',1fr)"':'')+'>'+areas.map(function(k){ var p=Math.round(Math.max(0,Math.min(1,a[k]||0))*100);
    return '<div class="barra"><span class="bn">'+k+(pct?'<b>'+p+'%</b>':'')+'</span><span class="bt"><i style="width:'+p+'%;background:'+COLOR_AREA[k]+'"></i></span></div>'; }).join('')+'</div>';
}
function trackLote(l){
  if(!S.datos.areasFases) return '';
  var a=avanceLote(l); a.Empacado=l.cantidad?Math.min(1,(l.empacadas||0)/l.cantidad):0;
  var yo=miArea();
  return barrasAreas(a, false, yo!=='Todas'?[yo]:null);
}
/* En el botón de cada pieza: la barra del área de quien registra (o el total de fases si ve todas) */
function trackPieza(l,pieza){
  if(!S.datos.areasFases) return '';
  var base=fasesBase(l,pieza), ci=base.indexOf(l.av[pieza]), ar=areaFases();
  var fa = ar==='Todas' ? base : base.filter(function(f){ return areaDeFase(pieza,f)===ar; });
  if(!fa.length) return '';
  var n=fa.filter(function(f){ return base.indexOf(f)<=ci; }).length, p=Math.round(n/fa.length*100);
  return '<div class="barras una"><div class="barra"><span class="bn"><b>'+n+' de '+fa.length+'</b></span><span class="bt"><i style="width:'+p+'%;background:'+(ar==='Todas'?'var(--y)':COLOR_AREA[ar])+'"></i></span></div></div>';
}
function miArea(){ var a=(S.datos.areaUsuarios||{})[S.nombre]; return (a && AREAS.indexOf(a)>=0) ? a : 'Todas'; }
/* Área cuyas fases ve en "Avance de un lote": cada quien las de su área; el encargado, las de Corte.
   En "Pasar hoja de papel" el encargado ve todas, porque captura lo de otros. */
function areaFases(){
  if(!S.datos.areasFases) return 'Todas';
  if(esAdmin()) return S.papel ? 'Todas' : 'Corte';
  return miArea();
}
function numFase(f){ var n=parseInt(String(f||'').slice(0,2),10); return isNaN(n)?0:n; }
function areaDeFase(pieza,fase){ var e=(S.datos.areasFases||[]).filter(function(x){ return x.pieza===pieza && x.fase===fase; })[0]; return e?e.area:null; }
/* Avance de un lote en cada área (0 a 1), con la última fase registrada de cada pieza */
function avanceLote(l){
  var r={}; AREAS.forEach(function(a){ var tot=0, hec=0;
    (S.datos.areasFases||[]).forEach(function(e){
      if(e.area!==a) return;
      if(e.pieza==='Empacado'){ tot++; hec+=l.cantidad?Math.min(1,(l.empacadas||0)/l.cantidad):0; return; }
      if(e.techo && !l.techo) return;
      tot++; if(e.n<=numFase(l.av[e.pieza])) hec++;
    });
    r[a]=tot?hec/tot:1; });
  return r;
}
function avancePedido(oc){
  var t=0, r={Corte:0,Lijado:0,Pintura:0,Empacado:0};
  S.datos.lotes.forEach(function(l){ if(l.oc!==oc) return; var a=avanceLote(l); t+=l.cantidad;
    AREAS.forEach(function(k){ r[k]+=a[k]*l.cantidad; }); r.Empacado+=Math.min(l.empacadas||0,l.cantidad); });
  if(t) Object.keys(r).forEach(function(k){ r[k]/=t; });
  r.urnas=t; return r;
}
function barrasAvance(){
  if(!S.datos.areasFases) return '';
  var h='', yo=miArea();
  (S.datos.ocs||[]).forEach(function(oc){
    var a=avancePedido(oc); if(!a.urnas) return;
    h+='<div class="card avance"><div class="av-tit">Avance del pedido <b>'+esc(oc)+'</b> · '+a.urnas+' urnas</div>'+barras(a,false,yo,yo!=='Todas'?[yo]:null)+'</div>';
  });

}

function filtrarLotes(f){
  f=norm(f).split(/\s+/).filter(Boolean);
  var grupos={}, orden=[], h='';
  S.datos.lotes.forEach(function(l,i){
    var t=norm(l.folio); if(f.length && !f.every(function(w){ return t.indexOf(w)>=0; })) return;
    if(miArea()!=='Todas' && !S.verTodo && avanceLote(l)[miArea()]>=1) return;
    var k=l.oc+'|'+l.semana; if(!grupos[k]){ grupos[k]=[]; orden.push(k); } grupos[k].push(i);
  });
  orden.sort(function(a,b){ var A=a.split('|'),B=b.split('|'); return A[0]===B[0] ? (Number(A[1])||0)-(Number(B[1])||0) : (A[0]<B[0]?-1:1); });
  /* Una semana está completa cuando todos sus lotes ya están empacados (Terminado):
     esas se van al final, en verde y plegadas, para que no estorben */
  var semanaLista=function(k){ var p=k.split('|');
    var ls=S.datos.lotes.filter(function(l){ return l.oc===p[0] && String(l.semana)===p[1]; });
    return ls.length>0 && ls.every(function(l){ return l.estado==='Terminado' || (l.empacadas||0)>=l.cantidad; }); };
  var activas=orden.filter(function(k){ return !semanaLista(k); }), listas=orden.filter(semanaLista);
  var pintarSemana=function(k, verde){
    var p=k.split('|'), ids=grupos[k], tot=0, emp=0, r='';
    ids.forEach(function(i){ tot+=S.datos.lotes[i].cantidad; emp+=Math.min(S.datos.lotes[i].empacadas||0,S.datos.lotes[i].cantidad); });
    r+='<div class="oc semana'+(verde?' lista':'')+'"><span class="num">S'+esc(p[1])+'</span><div><div class="tit">Semana '+esc(p[1])+(verde?' · terminada':'')+'</div><span>'+(verde?'Pedido '+esc(p[0])+' · ':'')+tot+' urnas · empacadas '+emp+'</span></div></div>';
    ids.forEach(function(i){
      var l=S.datos.lotes[i];
      r+='<button class="lote" onclick="detalle('+i+')"><div class="fila"><b>'+esc(corto(l.folio))+'</b>'+tagEstado(l.estado)+ic('chev',18)+'</div>'+
         '<span class="cant">'+l.cantidad+' piezas</span>'+trackLote(l)+'</button>';
    });
    return r;
  };
  var ocAnt=null;
  activas.forEach(function(k){
    var oc=k.split('|')[0];
    if(oc!==ocAnt){ h+='<div class="oc pedido">PEDIDO '+esc(oc)+'</div>'; ocAnt=oc; }
    h+=pintarSemana(k,false);
  });
  if(listas.length){
    if(!activas.length) h+='<div class="card">Todas las semanas de estos lotes ya están terminadas.</div>';
    h+='<details class="hechas"><summary>'+ic('check',20,0,3)+'Semanas terminadas ('+listas.length+') <small>toca para ver</small></summary>'+listas.map(function(k){ return pintarSemana(k,true); }).join('')+'</details>';
  }

function semanaHoy(oc, fecha){
  var p=(S.datos.pedidos||[]).filter(function(x){ return x.oc===oc; })[0];
  if(!p || !p.inicio) return '';
  var i=new Date(p.inicio), d=fecha?new Date(fecha):new Date();
  var a=Date.UTC(i.getFullYear(),i.getMonth(),i.getDate()), b=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  return Math.max(1, Math.floor(Math.round((b-a)/86400000)/7)+1);
}
function lotesDe(r){
  return S.datos.lotes.filter(function(l){ return l.oc===r.oc && l.modelo===r.modelo && (l.color===r.color || (!r.color && (l.color==='—'||!l.color))); })
    .sort(function(a,b){ var na=+(a.folio.match(/#(\d+)/)||[0,0])[1], nb=+(b.folio.match(/#(\d+)/)||[0,0])[1]; return na-nb; });
}
/* Reparte la cantidad en los lotes del modelo, en orden (#1, #2…) */
function repartir(r, cant){
  var res=[], resto=cant;
  lotesDe(r).forEach(function(l){
    var falta=l.cantidad-Math.min(l.empacadas||0,l.cantidad);
    if(resto<=0 || falta<=0) return;
    var toma=Math.min(falta,resto); res.push({lote:l, toma:toma, falta:falta}); resto-=toma;
  });
  return {partes:res, sobra:resto};
}

/* Fases que aplican a este lote (sin las de techo si el modelo no lleva techo) */
/* Nombre de la fase como lo ve el trabajador: sin el número ("01 - ") ni "(si lleva)" */
function nomFase(f){ return String(f||'').replace(/^\s*\d+\s*-\s*/,'').replace(/\s*\(si lleva\)\s*/i,'').trim(); }
/* ¿Esta fase solo aplica a modelos con techo? (marcada en Áreas o con "(si lleva)" / "techo" en el nombre) */
function esFaseTecho(pieza,f){
  if(/\(si lleva\)|techo/i.test(f)) return true;
  return (S.datos.areasFases||[]).some(function(e){ return e.pieza===pieza && e.fase===f && e.techo; });
}
function fasesDe(l,pieza){
  var lista=S.datos.fases[pieza]||[];
  if(pieza!=='Techo' && !l.techo) lista=lista.filter(function(f){ return !esFaseTecho(pieza,f); });
  if(S.datos.faseEmpaque) lista=lista.filter(function(f){ return f!==S.datos.faseEmpaque; });
  if(areaFases()!=='Todas'){ var a=areaFases(); var sol=lista.filter(function(f){ var x=areaDeFase(pieza,f); return !x || x===a; }); lista=sol; }
  return lista;
}
function sugerida(l,pieza){
  var todas=S.datos.fases[pieza]||[], lista=fasesDe(l,pieza), act=todas.indexOf(l.av[pieza]);
  if(act<0) return lista[0];
  for(var k=0;k<lista.length;k++){ if(todas.indexOf(lista[k])>act) return lista[k]; }
  return lista[lista.length-1];
}

/* ---------- registro rápido: "Terminé <área>" ----------
   El trabajador solo dice que terminó su área en el lote; la app calcula hasta qué fase llegó cada pieza:
   desde la fase en que va, el siguiente bloque seguido de fases de esa área (pestaña Áreas). */
function fasesBase(l,pieza){
  if(pieza==='Techo' && !l.techo) return [];
  var lista=S.datos.fases[pieza]||[];
  if(pieza!=='Techo' && !l.techo) lista=lista.filter(function(f){ return !esFaseTecho(pieza,f); });
  if(S.datos.faseEmpaque) lista=lista.filter(function(f){ return f!==S.datos.faseEmpaque; });
  return lista;
}
function bloque(l,pieza,area){
  var lista=fasesBase(l,pieza), j=lista.indexOf(l.av[pieza])+1;
  while(j<lista.length && areaDeFase(pieza,lista[j])!==area) j++;
  if(j>=lista.length) return null;
  var k=j; while(k+1<lista.length && areaDeFase(pieza,lista[k+1])===area) k++;
  return {desde:lista[j], hasta:lista[k], n:k-j+1};
}
function itemsArea(l,area){
  return PIEZAS.map(function(p){ var b=bloque(l,p[0],area); return b?{pieza:p[0], nom:p[1], b:b}:null; }).filter(Boolean);
}
/* Registro por fase (el registro rápido por área quedó desactivado a petición del dueño) */
function detalle(i,pieza){ return detalleFase(i,pieza); }
function detalleRapido(i,pieza){

  var areas=miArea()!=='Todas'?[miArea()]:AREAS;

  S.rapido=ops;
  var h='<button class="back" onclick="lotes()">'+ic('back',18,0,3)+'Lotes</button><h2>'+esc(corto(l.folio))+'</h2><p class="sub">'+l.cantidad+' piezas · pedido '+esc(l.oc)+' · '+tagEstado(l.estado)+'</p>';
  if(!ops.length) h+='<div class="card">'+(miArea()!=='Todas'?'Tu área ya terminó todo lo de este lote.':'Este lote ya pasó por todas las fases.')+'</div>';
  ops.forEach(function(o,k){
    h+='<button class="big b3 rapido" onclick="terminarArea('+i+','+k+')">✓<span>Terminé '+esc(o.area)+' · '+l.cantidad+' piezas<small>'+
       o.items.map(function(x){ return esc(x.nom)+': '+esc(x.b.n>1?nomFase(x.b.desde)+' → '+nomFase(x.b.hasta):nomFase(x.b.hasta)); }).join('<br>')+'</small></span></button>';

function guardarAvance(){
  var cant=parseInt($('cant').value,10)||0, dan=parseInt($('dan').value,10)||0;
  if(cant<=0){ $('err').textContent='Escribe cuántas piezas pasaron (más de 0) o toca "Todo el lote".'; return; }
  var l=S.lote, pz=(PIEZAS.filter(function(p){ return p[0]===S.pieza; })[0]||[0,S.pieza])[1];
  var fase=$('fase').value;
  var rec={ id:uid(), tipo:'avance', nombre:S.nombre, ts:fechaRegistro(), folio:l.folio, pieza:S.pieza,
            fase:fase, cantidad:cant, danadas:dan, comentario:$('com').value.trim() };
  /* Orden de fases: no se puede registrar más de lo que ya terminó la fase anterior */
  var disp=disponible(l,S.pieza,fase), pv=previa(l,S.pieza,fase);
  if(isFinite(disp) && cant>disp){
    $('err').textContent = disp<=0 ? (pv?'Primero se tiene que registrar '+nomFase(pv)+'.':'Esta fase ya está completa en este lote.')
                                  : 'Solo puedes registrar hasta '+disp+(pv?': son las piezas que ya terminaron '+nomFase(pv)+'.':': es el tamaño del lote.');
    return;
  }
  /* Revisiones para evitar errores comunes (si no hay datos de cantidades) */

  if(cant>l.cantidad) av.push('Pusiste '+cant+' y el lote es de '+l.cantidad+'.');

  if(!isFinite(disp) && fi>ci+1){
    var area=areaDeFase(S.pieza,fase), falta=base.slice(ci+1,fi);
    var txt=falta.slice(0,4).map(function(f){ var a=areaDeFase(S.pieza,f); return nomFase(f)+(a&&area&&a!==area?' ('+a+')':''); }).join(', ')+(falta.length>4?' y '+(falta.length-4)+' más':'');
    av.push('Todavía no se registra: '+txt+'. ¿Seguro que ya terminaste '+nomFase(fase)+'?');
  }
  if(dan>cant) av.push('Pusiste más dañadas ('+dan+') que piezas ('+cant+').');
  preguntar([['Lote',corto(l.folio)+' · Semana '+l.semana],['Pieza',pz],['Fase que terminó',nomFase(fase)],['Piezas que pasaron',cant]].concat(dan?[['Dañadas',dan]]:[]),

/* Achica la foto para que no pese (máx. 1280 px) */
function leerFoto(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var M=1280, w=img.width, h=img.height, k=Math.min(1,M/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.foto=c.toDataURL('image/jpeg',0.7);
      $('pfoto').innerHTML='<img src="'+S.foto+'" style="max-width:100%;border-radius:6px;margin-top:8px"><button class="link" onclick="S.foto=null;$(\'pfoto\').innerHTML=\'\'">Quitar foto</button>';
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function guardarProblema(){
  var d=$('pdesc').value.trim(), lote=$('plote').value;
  if(!d){ $('err').textContent='Escribe qué pasó.'; return; }
  preguntar([['Tipo',S.tipoProb]].concat(lote?[['Lote',corto(lote)]]:[]).concat([['Descripción',d.length>60?d.slice(0,60)+'…':d],['Foto',S.foto?'Sí':'No']]), [], function(){
    encolar({ id:uid(), tipo:'problema', nombre:S.nombre, ts:fechaRegistro(), tipoProblema:S.tipoProb, lote:lote, descripcion:d, foto:S.foto||'' }, 'Problema: '+S.tipoProb+' · '+d.slice(0,40), 'problema');
  }, { sub:'Revisa el reporte', si:ic('check',22,0,3)+'Sí, enviar' });
}

/* Avance de un grupo de lotes en cada área (0 a 1), ponderado por cantidad */
function avanceGrupo(ls){
  var t=0, r={Corte:0,Lijado:0,Pintura:0,Empacado:0};
  ls.forEach(function(l){ var a=avanceLote(l); t+=l.cantidad; AREAS.forEach(function(k){ r[k]+=a[k]*l.cantidad; }); r.Empacado+=Math.min(l.empacadas||0,l.cantidad); });
  if(t) Object.keys(r).forEach(function(k){ r[k]/=t; });
  r.urnas=t; return r;
}

  if(!ocs.length) h+='<div class="card">No hay pedidos activos.</div>';
  ocs.forEach(function(oc){
    var ls=S.datos.lotes.filter(function(l){ return l.oc===oc; }); if(!ls.length) return;
    var a=avanceGrupo(ls), atr=ls.filter(function(l){ return l.estado==='Atrasado'; }).length;
    h+='<div class="card avance"><div class="av-tit">Pedido <b>'+esc(oc)+'</b> · '+a.urnas+' urnas · '+ls.length+' lotes'+(atr?' · <span style="color:var(--red)">'+atr+' atrasado(s)</span>':'')+'</div>'+barras(a)+'</div>';
    var sems={}; ls.forEach(function(l){ (sems[l.semana]=sems[l.semana]||[]).push(l); });
    var lista=function(sm){ return sems[sm].every(function(l){ return l.estado==='Terminado' || (l.empacadas||0)>=l.cantidad; }); };
    Object.keys(sems).sort(function(x,y){ return (lista(x)-lista(y)) || ((Number(x)||0)-(Number(y)||0)); }).forEach(function(sm){
      var g=sems[sm], ag=avanceGrupo(g), ok=lista(sm);
      h+='<div class="card'+(ok?' sem-ok':'')+'"><b>'+(ok?'✓ ':'')+'Semana '+esc(sm)+(ok?' · terminada':'')+'</b> <span class="sub">· '+ag.urnas+' urnas</span>'+barras(ag,true)+
         '<details style="margin-top:6px"><summary class="sub">Ver cada lote ('+g.length+')</summary>'+
         g.map(function(l){ var al=avanceLote(l), e=Math.round(Math.min(l.empacadas||0,l.cantidad)/(l.cantidad||1)*100);
           return '<div style="margin-top:8px"><b style="font-size:13px">'+esc(corto(l.folio))+'</b> '+tagEstado(l.estado)+'<div class="mini" style="font-size:12px">'+
             AREAS.map(function(k){ return '<em style="font-style:normal;margin-right:8px;color:'+COLOR_AREA[k]+'">'+k+' '+Math.round(al[k]*100)+'%</em>'; }).join('')+
             '<em style="font-style:normal;color:'+COLOR_AREA.Empacado+'">Empacado '+e+'%</em></div></div>'; }).join('')+
         '</details></div>';
    });
  });
  pantalla(h);
}
/* ---------- panel del encargado ---------- */
function panelEncargado(){
  if(!esAdmin()) return menu();
  var h='<button class="back" onclick="vistaEncargado()">'+ic('back',18,0,3)+'Vista de encargado</button><h2>Panel del encargado</h2>'+barrasAvance();
  var atr=(S.datos.lotes||[]).filter(function(l){ return l.estado==='Atrasado'; });
  h+='<div class="card"><b>Lotes atrasados ('+atr.length+')</b><br>'+(atr.length?atr.map(function(l){ return esc(corto(l.folio))+' <small>(semana '+esc(l.semana)+')</small>'; }).join('<br>'):'<span class="sub">Ninguno</span>')+'</div>';
  var cortar=Object.keys(S.datos.estante||{}).filter(function(k){ return S.datos.estante[k].estado==='CORTAR YA'; });
  h+='<div class="card"><b>'+dot('rojo')+' Piezas que hay que cortar ya ('+cortar.length+')</b><br>'+(cortar.length?cortar.slice(0,25).map(esc).join('<br>')+(cortar.length>25?'<br>…':''):'<span class="sub">Ninguna</span>')+'</div>';
  if(S.datos.almacen){
    var rojo=[], amar=[];
    Object.keys(S.datos.almacen).forEach(function(a){ S.datos.almacen[a].forEach(function(x){ if(x.estado==='CRÍTICO') rojo.push(x); else if(x.estado==='POR AGOTARSE') amar.push(x); }); });
    h+='<div class="card"><b>Material para comprar</b><br>'+(rojo.length||amar.length?rojo.map(function(x){ return ''+dot('rojo')+' '+esc(x.nombre)+' <small>(quedan '+x.existencia+' '+esc(x.unidad)+')</small>'; }).concat(amar.map(function(x){ return ''+dot('amarillo')+' '+esc(x.nombre)+' <small>(quedan '+x.existencia+' '+esc(x.unidad)+')</small>'; })).join('<br>'):'<span class="sub">Todo bien de existencia</span>')+'</div>';
  }
  h+='<div id="panelSrv"><p class="sub">Cargando registros y problemas…</p></div>';
  pantalla(h);
  google.script.run
    .withSuccessHandler(function(d){ if($('panelSrv')) $('panelSrv').innerHTML=panelSrvHtml(d); })
    .withFailureHandler(function(err){ if($('panelSrv')) $('panelSrv').innerHTML='<div class="card">Sin internet: no se pueden ver los registros del día ni los problemas.<br><small>'+esc(String(err&&err.message||err).replace(/^SIN_RED:\s*/,''))+'</small></div>'; })
    .panel({ nombre:S.nombre, firma:S.firma });
}
function panelSrvHtml(d){
  var h='';
  h+='<div class="card"><b>Registros de hoy</b><br>'+(Object.keys(d.registrosHoy||{}).map(function(n){ return esc(n)+': '+d.registrosHoy[n]; }).join(' · ')||'<span class="sub">Nadie ha registrado hoy</span>')+
     (d.sinRegistro&&d.sinRegistro.length?'<div class="warn" style="margin-top:8px">Sin registrar hoy: '+d.sinRegistro.map(esc).join(', ')+'</div>':'')+'</div>';
  h+='<div class="card"><b>Problemas sin resolver ('+(d.problemas||[]).length+')</b>';
  (d.problemas||[]).forEach(function(p){
    h+='<div class="prob"><small>'+esc(p.fecha)+' · '+esc(p.quien)+' · '+esc(p.tipo)+(p.lote?' · '+esc(corto(p.lote)):'')+'</small><br>'+esc(p.desc)+
       (/^https?:/.test(p.foto)?'<br><a href="'+esc(p.foto)+'" target="_blank" rel="noopener">Ver foto</a>':(p.foto?'<br>Foto en tu correo':''))+
       '<br><button class="link" onclick="resolverProb(\''+esc(p.id)+'\')">✓ Marcar resuelto</button></div>';
  });
  if(!(d.problemas||[]).length) h+='<br><span class="sub">Ninguno</span>';
  h+='</div><div class="card"><b>Últimos registros</b><p class="sub" style="margin:4px 0">Puedes anular cualquiera si está mal.</p>';
  (d.ultimos||[]).forEach(function(r){
    h+='<div class="reg"><div><small>'+esc(r.cuando)+' · '+esc(r.nombre)+'</small><br>'+esc(r.texto)+'</div><button class="bR chico" onclick="anularReg(\''+esc(r.id)+'\', panelEncargado)">Anular</button></div>';
  });
  return h+'</div>';
}
function resolverProb(id){
  google.script.run.withSuccessHandler(function(){ problemasEnc(); }).withFailureHandler(function(e){ alert('No se pudo: '+String(e&&e.message||e)); }).resolver({ id:id, nombre:S.nombre, firma:S.firma });
}

/* ---------- modo oscuro: Automático (como el celular) / Oscuro / Claro ---------- */
var TEMAS={auto:ic('half',16)+'Tema: automático', oscuro:ic('moon',16)+'Tema: oscuro', claro:ic('sun',16)+'Tema: claro'};
function aplicarTema(){
  var t=leer('tema','claro'), sis=window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  var osc = t==='oscuro' || (t==='auto' && sis);
  document.body.classList.toggle('oscuro', osc);
  var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', '#15304F');
}
function cambiarTema(){ var orden=['claro','oscuro','auto'], t=leer('tema','claro'); guardar('tema', orden[(orden.indexOf(t)+1)%3]); aplicarTema(); menu(); }
if(window.matchMedia){ var mq=matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change',aplicarTema); else if(mq.addListener) mq.addListener(aplicarTema); }
aplicarTema();

/* ---------- arranque ---------- */
pintarEstado();
cargarDatos(function(){ inicio(); enviarPendientes(); });
