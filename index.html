  /* Colores: azul = navegar y elegir; naranja = registrar/confirmar; gris y blanco = fondo.
     Verde solo para "terminado/enviado" y rojo solo para "atrasado/error". */
  :root{--bg:#EEF2F6;--card:#FFFFFF;--card2:#F4F6F9;--line:#CDD6E0;--tx:#16263A;--mu:#566575;
    --y:#1F5FA8;--yx:#1F5FA8;--yt:#FFFFFF;--azS:#E5EEF9;--nar:#B9520B;--narTx:#B9520B;--narS:#FFF1E4;
    --ok:#1D7748;--okbg:#E1F2E8;--red:#BE3326;--redbg:#FBE5E2;--wbg:#FFF1E4;--wtx:#7A3608;--vacio:#E0E6ED;--amar:#E9B800;--amartx:#7A5D00;
    --a-Corte:#7C8B9D;--a-Lijado:#E8892B;--a-Pintura:#2F74C0;--a-Empacado:#15304F;--silbg:#EEF2F6}
  body.oscuro{--bg:#0F1A27;--card:#182637;--card2:#1F3045;--line:#2E415A;--tx:#EEF2F6;--mu:#A2B2C3;
    --y:#2F6FC6;--yx:#7DB1F0;--yt:#FFFFFF;--azS:#1C3554;--nar:#B9520B;--narTx:#F2A15C;--narS:#3A2414;
    --ok:#5FCF8F;--okbg:#14301F;--red:#FF7B6E;--redbg:#3B1A17;--wbg:#3A2414;--wtx:#FFC28F;--vacio:#2E415A;--amar:#F5C518;--amartx:#F5C518;
    --a-Corte:#A6B4C4;--a-Lijado:#F2913D;--a-Pintura:#62A0EC;--a-Empacado:#DCE5EF;--silbg:#D9E1EA}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Legible',Roboto,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;line-height:1.45;letter-spacing:.15px;-webkit-tap-highlight-color:transparent}
  svg.ic{flex:none;display:block}
  b,strong{font-weight:700}
  header{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top));z-index:5;background:#15304F;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
  header h1{font-size:21px;font-weight:700;letter-spacing:1.5px;line-height:1;margin:0;flex:1;color:#fff}
  header h1:after{content:'';display:block;width:30px;height:4px;border-radius:2px;background:#F28C28;margin-top:5px}
  .pill{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);color:#9FE2B9;white-space:nowrap}
  .pill:before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor}
  .pill.off{color:#FFB0A8}.pill.pend{color:#FFC48F}
  main{padding:18px 16px 28px;max-width:560px;margin:0 auto}
  h2{font-size:27px;font-weight:700;line-height:1.2;letter-spacing:.2px;margin:6px 0 14px}
  h3{font-weight:700;letter-spacing:.2px}
  .sub{color:var(--mu);font-size:15px;line-height:1.5;margin:-6px 0 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{font:inherit;color:inherit;letter-spacing:inherit;border:0;border-radius:10px;cursor:pointer;background:none}
  button:active{transform:scale(.98)}
  .big{width:100%;min-height:64px;padding:14px 16px;font-size:18px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:14px;text-align:left;line-height:1.3}
  .big small{display:block;font-weight:400;font-size:15px;opacity:.9;margin-top:3px}
  .b1{background:var(--y);color:var(--yt)}
  .b3{background:var(--nar);color:#fff}
  .b2{background:var(--card);color:var(--tx);border:2px solid var(--line)}
  .b4{background:var(--card);color:var(--tx);border:2px dashed var(--y)}
  .bR{background:var(--red);color:#fff}
  /* inicio */
  .hola{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 16px}
  .hola h2{margin:0;font-size:32px;line-height:1.1}
  .hola .area{text-align:right;font-size:14px;color:var(--mu)}
  .hola .area b{display:block;font-size:20px;color:var(--yx);line-height:1.2}
  .hero{width:100%;min-height:118px;background:var(--y);color:#fff;border-radius:14px;padding:18px;display:flex;align-items:center;gap:16px;text-align:left;margin-bottom:12px}
  .hero b,.hero small{display:block}
  .hero b{font-size:26px;line-height:1.2}
  .hero small{font-size:16px;margin-top:4px;opacity:.92}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

/* Filtros de la lista de lotes: modelo, pedido y solo atrasados */

function filtrarLotes(f){
  f=norm(f).split(/\s+/).filter(Boolean);
  var grupos={}, orden=[], h='';
  S.datos.lotes.forEach(function(l,i){
    var t=norm(l.folio+' '+l.modelo+' '+l.color+' '+l.oc); if(f.length && !f.every(function(w){ return t.indexOf(w)>=0; })) return;
    if(S.fModeloL && l.modelo!==S.fModeloL) return;
    if(S.fOcL && l.oc!==S.fOcL) return;
    if(S.fAtrL && l.estado!=='Atrasado') return;
    /* Pendientes = a mi área le falta algo en ese lote; Terminados = mi área ya hizo todas sus fases */
    if(miArea()!=='Todas' && (avanceLote(l)[miArea()]>=1) !== !!S.verListos) return;
    var k=l.oc+'|'+l.semana; if(!grupos[k]){ grupos[k]=[]; orden.push(k); } grupos[k].push(i);
  });
  orden.sort(function(a,b){ var A=a.split('|'),B=b.split('|'); if((A[0]==='ADELANTO')!==(B[0]==='ADELANTO')) return A[0]==='ADELANTO'?1:-1; return A[0]===B[0] ? (Number(A[1])||0)-(Number(B[1])||0) : (A[0]<B[0]?-1:1); });
  /* Una semana está completa cuando todos sus lotes ya están empacados (Terminado):
     esas se van al final, en verde y plegadas, para que no estorben */
  var semanaLista=function(k){ var p=k.split('|');
    var ls=S.datos.lotes.filter(function(l){ return l.oc===p[0] && String(l.semana)===p[1]; });
    return ls.length>0 && ls.every(function(l){ return l.estado==='Terminado' || (l.empacadas||0)>=l.cantidad; }); };
  var activas=orden.filter(function(k){ return !semanaLista(k); }), listas=orden.filter(semanaLista);
  var pintarSemana=function(k, verde){
    var p=k.split('|'), ids=grupos[k], tot=0, emp=0, r='';
    ids.forEach(function(i){ tot+=S.datos.lotes[i].cantidad; emp+=Math.min(S.datos.lotes[i].empacadas||0,S.datos.lotes[i].cantidad); });
    if(p[0]==='ADELANTO') r+='<div class="oc semana adelanto'+(verde?' lista':'')+'"><span class="num">A</span><div><div class="tit">Adelantos'+(verde?' · terminados':'')+'</div><span>'+tot+' urnas · llegan hasta antes de mandar a fondo y pasan al estante</span></div></div>';
    else r+='<div class="oc semana'+(verde?' lista':'')+'"><span class="num">S'+esc(p[1])+'</span><div><div class="tit">Semana '+esc(p[1])+(verde?' · terminada':'')+'</div><span>'+(verde?'Pedido '+esc(p[0])+' · ':'')+tot+' urnas · empacadas '+emp+'</span></div></div>';
    ids.forEach(function(i){
      var l=S.datos.lotes[i];
      r+='<button class="lote" onclick="detalle('+i+')"><div class="fila">'+silTile(l.modelo,l.color,42)+'<b>'+esc(corto(l.folio))+'</b>'+tagEstado(l.estado)+ic('chev',18)+'</div>'+
         '<span class="cant">'+l.cantidad+' piezas</span>'+(function(){ var x=llegadaDe(l), n=x.reduce(function(a,y){ return a+y.pend; },0); return n?'<span class="tag t-lleg">Te mandaron '+n+' piezas</span>':''; })()+trackLote(l)+'</button>';
    });
    return r;
  };
  var ocAnt=null;
  activas.forEach(function(k){
    var oc=k.split('|')[0];
    if(oc!==ocAnt){ h+='<div class="oc pedido">'+(oc==='ADELANTO'?'SIN PEDIDO · ADELANTOS':'PEDIDO '+esc(oc))+'</div>'; ocAnt=oc; }
    h+=pintarSemana(k,false);
  });
  if(listas.length){
    if(!activas.length) h+='<div class="card">Todas las semanas de estos lotes ya están terminadas.</div>';
    h+='<details class="hechas"><summary>'+ic('check',20,0,3)+'Semanas terminadas ('+listas.length+') <small>toca para ver</small></summary>'+listas.map(function(k){ return pintarSemana(k,true); }).join('')+'</details>';
  }
  $('listaLotes').innerHTML = h || (miArea()!=='Todas' ? (S.verListos ? '<div class="card">Todavía no hay lotes terminados por <b>'+miArea()+'</b>.</div>' : '<div class="card">No hay lotes pendientes para <b>'+miArea()+'</b>. Los que ya terminaste están en <b>Terminados</b>.</div>') : '<div class="card">No hay lotes con ese nombre. Revisa que el pedido esté <b>Activo</b> o toca "Actualizar datos".</div>');
}

/* ---------- empacado ---------- */
function semanaHoy(oc, fecha){
  var p=(S.datos.pedidos||[]).filter(function(x){ return x.oc===oc; })[0];
  if(!p || !p.inicio) return '';
  var i=new Date(p.inicio), d=fecha?new Date(fecha):new Date();
  var a=Date.UTC(i.getFullYear(),i.getMonth(),i.getDate()), b=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  return Math.max(1, Math.floor(Math.round((b-a)/86400000)/7)+1);
}
function lotesDe(r){
  return S.datos.lotes.filter(function(l){ return l.oc===r.oc && l.modelo===r.modelo && (l.color===r.color || (!r.color && (l.color==='—'||!l.color))); })
    .sort(function(a,b){ var na=+(a.folio.match(/#(\d+)/)||[0,0])[1], nb=+(b.folio.match(/#(\d+)/)||[0,0])[1]; return na-nb; });
}
/* Reparte la cantidad en los lotes del modelo, en orden (#1, #2…) */
function repartir(r, cant){
  var res=[], resto=cant;
  lotesDe(r).forEach(function(l){
    var falta=l.cantidad-Math.min(l.empacadas||0,l.cantidad);
    if(resto<=0 || falta<=0) return;
    var toma=Math.min(falta,resto); res.push({lote:l, toma:toma, falta:falta}); resto-=toma;
  });
  return {partes:res, sobra:resto};
}
function empacado(oc){

  });
  var sem=semanaHoy(S.ocEmp);

     '<div id="pista" class="pista"></div>'+
     (sem?'<div class="sub" style="margin-top:8px">Se entrega en la <b>Semana '+sem+'</b> del pedido '+esc(S.ocEmp)+'</div>':'')+
     '<label>Comentario (opcional)</label><input type="text" id="com" maxlength="200">';
  if(S.papel) h+=quienHtml()+'<label>Fecha y hora (de la hoja de papel)</label><input type="datetime-local" id="fh" value="'+ahoraLocal()+'">';

/* ---------- almacén de urnas terminadas ---------- */
var TM_MOTIVOS={
  Entrada:[['Sobrantes de un pedido','Sobrantes de un pedido','Las extras que el cliente no se llevó. Se restan de los extras de ese pedido.'],
           ['Conteo inicial','Conteo inicial','Las que ya estaban guardadas antes de usar la app.'],
           ['Otra entrada','Otra','Cualquier otra entrada. Escribe el motivo en el comentario.']],
  Salida:[['Para un pedido','Para un pedido','Para cubrir dañadas o porque el cliente pidió más. Cuentan como empacadas de ese pedido y de su lote.'],
          ['Reposición de devolución','Reposición','Para reponer lo que el cliente regresó. Se anotan solas como repuestas en Devoluciones.'],
          ['Otra salida','Otra','Muestra, venta suelta, etc. Solo se restan del almacén. Escribe el motivo en el comentario.']]
};
function tmConPedido(m){ return m==='Sobrantes de un pedido'||m==='Para un pedido'||m==='Reposición de devolución'; }
function tmTotal(){ return (S.datos.terminados||[]).reduce(function(a,t){ return a+Math.max(0,t.existencia); },0); }
/* Entrada del almacén para un modelo+color (por su código de catálogo) */
function tmDe(modelo,color){ return (S.datos.terminados||[]).filter(function(t){ return t.modelo===modelo && t.color===color; })[0]; }
function tmPedidos(m){
  if(m==='Para un pedido') return (S.datos.ocs||[]).slice();
  var vistos={}, r=[];
  (S.datos.rengTodos||[]).forEach(function(x){ if(vistos[x.oc]) return; if(m==='Sobrantes de un pedido' && x.extras<=0) return; vistos[x.oc]=1; r.push(x.oc); });
  return r.reverse();
}
function tmItems(){
  var T=S.tm, items=[];
  var nivel=function(n){ return n>0?['verde',dot('verde'),'Hay en almacén']:['rojo',dot('rojo'),'No hay en almacén']; };
  if(tmConPedido(T.motivo)){
    var src = T.motivo==='Para un pedido' ? (S.datos.renglones||[]) : (S.datos.rengTodos||[]);
    src.filter(function(r){ return r.oc===T.oc; }).forEach(function(r){
      var t=tmDe(r.modelo,r.color), hay=t?t.existencia:0;

      if(T.motivo==='Sobrantes de un pedido'){ var ex=(S.datos.rengTodos||[]).filter(function(q){ return q.oc===r.oc && q.codigo===r.codigo; })[0]; x.sub=r.codigo+' · extras de este pedido: '+(ex?ex.extras:0)+' · en almacén: '+hay; }

function guardarTerminado(){

/* Fases que aplican a este lote (sin las de techo si el modelo no lleva techo) */
/* Nombre de la fase como lo ve el trabajador: sin el número ("01 - ") ni "(si lleva)" */
function nomFase(f){ return String(f||'').replace(/^\s*\d+\s*-\s*/,'').replace(/\s*\(si lleva\)\s*/i,'').trim(); }
/* ¿Esta fase solo aplica a modelos con techo? (marcada en Áreas o con "(si lleva)" / "techo" en el nombre) */
function esFaseTecho(pieza,f){
  if(/\(si lleva\)|techo/i.test(f)) return true;

}
/* Áreas, columna F "Solo para estos modelos": la fase solo aplica a esos modelos (p. ej. Corte de ángulo solo en Casita) */
function faseAplica(modelo,pieza,fase){
  var e=(S.datos.areasFases||[]).filter(function(x){ return x.pieza===pieza && x.fase===fase; })[0];
  if(!e || !e.solo) return true;
  return String(e.solo).split(/[,;\/]/).some(function(m){ return norm(m).trim() && norm(m).trim()===norm(modelo).trim(); });
}
function fasesDe(l,pieza){
  var lista=(S.datos.fases[pieza]||[]).filter(function(f){ return faseAplica(l.modelo,pieza,f); });
  if(pieza!=='Techo' && !l.techo) lista=lista.filter(function(f){ return !esFaseTecho(pieza,f); });
  if(S.datos.faseEmpaque) lista=lista.filter(function(f){ return f!==S.datos.faseEmpaque; });
  lista=cortarAdelanto(l,lista);
  if(areaFases()!=='Todas'){ var a=areaFases(); var sol=lista.filter(function(f){ var x=areaDeFase(pieza,f); return !x || x===a; }); lista=sol; }

}

  if(act<0) return lista[0];

  return lista[lista.length-1];

/* ---------- registro rápido: "Terminé <área>" ----------

function fasesBase(l,pieza){
  if(pieza==='Techo' && !l.techo) return [];
  var lista=(S.datos.fases[pieza]||[]).filter(function(f){ return faseAplica(l.modelo,pieza,f); });
  if(pieza!=='Techo' && !l.techo) lista=lista.filter(function(f){ return !esFaseTecho(pieza,f); });

  el.innerHTML = c>m ? '<div class="warn err">Solo puedes registrar hasta '+m+(isFinite(disponible(S.lote,S.pieza,f))?(pv?': son las que ya terminaron '+esc(nomFase(pv))+'.':': es el tamaño del lote.'):'.')+'</div>'
    : avisosCantidad(f,c).map(function(t){ return '<div class="warn">'+esc(t)+'</div>'; }).join('');
}
function stepper(id,v,grande,decimal){
  return '<div class="step'+(grande?' grande':'')+'"><button aria-label="Menos" onclick="paso(\''+id+'\',-1)">'+ic('minus',28)+'</button><input type="number" '+(decimal?'inputmode="decimal" step="any"':'inputmode="numeric" pattern="[0-9]*" step="1"')+' id="'+id+'" value="'+v+'" min="0"><button aria-label="Más" onclick="paso(\''+id+'\',1)">'+ic('plus',28)+'</button></div>';
}
function paso(id,d){ var e=$(id); e.value=Math.max(0,Math.round(((parseFloat(e.value)||0)+d)*100)/100); if(S.alCambiar) S.alCambiar(id); }
function fechaRegistro(){
  if(S.papel && $('fh') && $('fh').value) return new Date($('fh').value).toISOString();
  return new Date().toISOString();
}

function descontarTornillosLocal(c){
  var T=S.datos.tornillos; ((S.datos.almacen||{})['Ferretería']||[]).forEach(function(x){ if(x.codigo===T.codigo){ x.existencia=Math.round((x.existencia-c)*100)/100;
    if(x.min!=null && x.alerta!=null) x.estado = x.existencia<=x.min ? 'CRÍTICO' : (x.existencia<=x.alerta ? 'POR AGOTARSE' : 'ESTABLE'); } });
  guardar('datos',S.datos);
}
function guardarAvance(){
  var cant=parseInt($('cant').value,10)||0, dan=parseInt($('dan').value,10)||0;
  if(cant<=0){ $('err').textContent='Escribe cuántas piezas pasaron (más de 0) o toca "Todo el lote".'; return; }
  var l=S.lote, pz=(PIEZAS.filter(function(p){ return p[0]===S.pieza; })[0]||[0,S.pieza])[1];
  var fase=$('fase').value;
  var rec={ id:uid(), tipo:'avance', nombre:S.nombre, ts:fechaRegistro(), folio:l.folio, pieza:S.pieza,
            fase:fase, cantidad:cant, danadas:dan, comentario:$('com').value.trim() };
  /* Orden de fases: no se puede registrar más de lo que ya terminó la fase anterior */
  var disp=disponible(l,S.pieza,fase), pv=previa(l,S.pieza,fase);
  if(isFinite(disp) && cant>disp){
    $('err').textContent = disp<=0 ? (pv?'Primero se tiene que registrar '+nomFase(pv)+'.':'Esta fase ya está completa en este lote.')
                                  : 'Solo puedes registrar hasta '+disp+(pv?': son las piezas que ya terminaron '+nomFase(pv)+'.':': es el tamaño del lote.');
    return;
  }
  /* Revisiones para evitar errores comunes (si no hay datos de cantidades) */
  var base=fasesBase(l,S.pieza), act=l.av[S.pieza], ci=base.indexOf(act), fi=base.indexOf(fase), av=[];
  avisosCantidad(fase,cant).forEach(function(t){ av.push(t); });
  if(!isFinite(disp) && ci>=0 && fi>=0 && fi<=ci) av.push(nomFase(fase)+' ya estaba registrada (esta pieza va en '+nomFase(act)+'). ¿Es otra tanda del mismo lote?');
  if(!isFinite(disp) && fi>ci+1){
    var area=areaDeFase(S.pieza,fase), falta=base.slice(ci+1,fi);
    var txt=falta.slice(0,4).map(function(f){ var a=areaDeFase(S.pieza,f); return nomFase(f)+(a&&area&&a!==area?' ('+a+')':''); }).join(', ')+(falta.length>4?' y '+(falta.length-4)+' más':'');
    av.push('Todavía no se registra: '+txt+'. ¿Seguro que ya terminaste '+nomFase(fase)+'?');
  }
  if(dan>cant) av.push('Pusiste más dañadas ('+dan+') que piezas ('+cant+').');
  var lineasVarios=[];
  if(S.variosOn && puedeVarios()){
    var partes=partesVarios(), suma=partes.reduce(function(a,x){ return a+x.cantidad; },0);
    if(!partes.length){ $('err').textContent='Marca quién trabajó y cuántas hizo cada quien.'; return; }
    if(suma!==cant){ $('err').textContent='Las partes suman '+suma+' y el total es '+cant+'. Corrige las cantidades o toca "Repartir igual".'; return; }
    rec.reparto=partes;
    lineasVarios.push(['Lo hicieron', partes.map(function(x){ return x.nombre+' '+x.cantidad; }).join(' · ')]);
    if($('mandaChk') && $('mandaChk').checked && S.mandaFase){ rec.manda=S.mandaFase; lineasVarios.push(['Y las mandaste', nomFase(S.mandaFase)+' · '+cant]); }
    partes.forEach(function(x){ var y=yaRegistro(x.nombre,l.folio,S.pieza,fase); if(y) av.push(x.nombre+' ya tiene '+y+' de '+nomFase(fase)+' en este lote hoy. ¿Lo estás contando otra vez?'); });
    if(rec.manda){ var ym=yaRegistro(null,l.folio,S.pieza,rec.manda); if(ym) av.push('Hoy ya se registró '+nomFase(rec.manda)+' ('+ym+') en este lote. ¿Es otra tanda?'); }
  } else {
    porOtros().filter(function(x){ return x.folio===l.folio && x.pieza===S.pieza && x.fase===fase; }).forEach(function(x){
      av.push(x.por+' ya registró por ti '+x.cantidad+' de '+nomFase(fase)+' en este lote. Si son las mismas piezas, no las registres otra vez.'); });
  }
  var T=S.datos.tornillos, torn=T && nomFase(fase).toLowerCase()===String(T.fase).toLowerCase() ? cant*T.porUrna : 0;
  preguntar([['Lote',corto(l.folio)+' · Semana '+l.semana],['Pieza',pz],['Fase que terminó',nomFase(fase)],['Piezas que pasaron',cant]].concat(lineasVarios).concat(dan?[['Dañadas',dan]]:[]).concat(torn?[['Tornillos que se descuentan',torn+' ('+(Math.round(torn/T.porBolsa*100)/100)+' '+(T.porBolsa>1?'bolsas':'pzas')+')']]:[]),
    av, function(){ if(torn) descontarTornillosLocal(torn/T.porBolsa); encolar(rec, corto(l.folio)+' · '+pz+' · '+nomFase(fase)+' · '+cant+(rec.reparto?' (entre varios: '+rec.reparto.map(function(x){ return x.nombre+' '+x.cantidad; }).join(', ')+')':'')+(rec.manda?' · y las mandó':''), 'avance'); S.variosOn=false; });
}
/* ---------- piezas adelantadas: sobrantes o devoluciones guardadas en el estante ----------
   El encargado las da de alta; al abrir un lote del mismo modelo, la app ofrece usarlas. */
function nomPieza(p){ return ({Wakal:'Huacal'})[p]||p; }
function adelStock(){ return (S.datos&&S.datos.adelantadas)||[]; }
function adelDe(modelo,pieza){ return adelStock().filter(function(a){ return norm(a.modelo)===norm(modelo) && a.pieza===pieza && a.cantidad>0; }); }
function sumarAdelLocal(modelo,pieza,fase,color,cant){
  if(!S.datos) return; var A=S.datos.adelantadas=S.datos.adelantadas||[]; color=color||'Sin pintar';
  var x=A.filter(function(a){ return a.modelo===modelo && a.pieza===pieza && a.fase===fase && a.color===color; })[0];
  if(!x){ x={modelo:modelo,pieza:pieza,fase:fase,color:color,cantidad:0}; A.push(x); }
  x.cantidad+=cant; S.datos.adelantadas=A.filter(function(a){ return a.cantidad>0; });
}
function servidorConAdel(){ return S.datos && !versionMenor(S.datos.version,'4.13'); }
function adelAvisoHtml(l,i){
  if(!servidorConAdel()) return '';
  var ad=adelDe(l.modelo,S.pieza); if(!ad.length) return '';
  var n=ad.reduce(function(a,x){ return a+x.cantidad; },0);
  return '<div class="card adel-aviso">'+ic('estante',26)+'<div><b>En el estante hay '+n+' '+esc(nomPieza(S.pieza))+' adelantadas</b><small>'+
    ad.map(function(a){ return a.cantidad+' que ya llegaron a '+esc(nomFase(a.fase))+' · '+esc(a.color); }).join('<br>')+'</small></div>'+
    '<button class="b3 chico" onclick="usarAdel('+i+',0)">Usar</button></div>';
}
function colorDistinto(a,b){ return norm(a)!=='sin pintar' && norm(a).split(' ')[0]!==norm(b).split(' ')[0]; }
function usarAdel(i,k){
  var l=S.datos.lotes[i], ad=adelDe(l.modelo,S.pieza), a=ad[k]; if(!a) return detalleFase(i,S.pieza);
  S.lote=l; S.loteIdx=i; S.adelSel={i:i,k:k,a:a};
  var base=fasesBase(l,S.pieza), fi=base.indexOf(a.fase), cuentan=fi>=0?base.slice(0,fi+1):base.slice();
  var pinta=colorDistinto(a.color,l.color), def=a.fase;
  if(pinta){ var ip=-1; cuentan.some(function(f,j){ if(areaDeFase(S.pieza,f)==='Pintura'){ ip=j; return true; } }); if(ip>0) def=cuentan[ip-1]; }
  if(cuentan.indexOf(def)<0) def=cuentan[cuentan.length-1];
  var h='<button class="back" onclick="detalleFase('+i+',\''+S.pieza+'\')">'+ic('back',18,0,3)+'Lote</button>'+
    '<div class="lotebox con-sil">'+silTile(l.modelo,l.color,56)+'<div><h2 class="lb-nom">'+esc(corto(l.folio))+'</h2><div class="lb-sem">'+l.cantidad+' piezas · '+esc(nomPieza(S.pieza))+'</div></div></div>'+
    '<h2>Usar piezas adelantadas</h2>';
  if(ad.length>1){ h+='<label class="paso"><i>1</i>¿Cuáles?</label><div class="seg col1">'+ad.map(function(x,j){ return '<button class="'+(j===k?'on':'')+'" onclick="usarAdel('+i+','+j+')"><b>'+x.cantidad+'</b> · llegaron a '+esc(nomFase(x.fase))+' · '+esc(x.color)+'</button>'; }).join('')+'</div>'; }
  else h+='<div class="card adel-aviso">'+silTile(l.modelo,a.color==='Sin pintar'?'Sin pintar':a.color,44)+'<div><b>'+a.cantidad+' '+esc(nomPieza(S.pieza))+' en el estante</b><small>Ya llegaron a '+esc(nomFase(a.fase))+' · '+esc(a.color)+'</small></div></div>';
  h+='<label class="paso"><i>'+(ad.length>1?2:1)+'</i>¿Cuántas usas en este lote?</label>'+stepper('cant',Math.min(a.cantidad,l.cantidad),true);
  h+='<label class="paso"><i>'+(ad.length>1?3:2)+'</i>¿Hasta qué fase cuentan en este lote?</label><select id="adFase" aria-label="Hasta qué fase cuentan">'+
    cuentan.map(function(f){ return '<option value="'+esc(f)+'"'+(f===def?' selected':'')+'>'+esc(nomFase(f))+'</option>'; }).join('')+'</select>';
  if(pinta) h+='<div class="warn">Estas piezas están pintadas de <b>'+esc(a.color)+'</b> y el lote es <b>'+esc(l.color)+'</b>: se vuelven a pintar. Por eso cuentan hasta <b>'+esc(nomFase(def))+'</b>. Si las van a repintar desde otra fase, cámbiala.</div>';
  h+='<p class="sub">Se registran como ya hechas en todas las fases hasta la que elijas, y se descuentan del estante.</p>';
  h+='<div class="fijo"><div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarUsoAdel()">'+ic('check',24,0,3)+'<span>Usar en este lote</span></button></div></div>';
  pantalla(h);
}
function guardarUsoAdel(){
  if(!servidorConAdel()){ $('err').textContent='Primero actualiza el servidor (Code.gs 4.13).'; return; }
  var sel=S.adelSel, l=S.datos.lotes[sel.i], a=sel.a, cant=parseInt($('cant').value,10)||0, fase=$('adFase').value;
  if(cant<=0){ $('err').textContent='Escribe cuántas usas (más de 0).'; return; }
  if(cant>a.cantidad){ $('err').textContent='En el estante solo hay '+a.cantidad+'.'; return; }
  var base=fasesBase(l,S.pieza), hi=base.indexOf(fase), av=[];
  var fases=base.slice(0,hi+1).map(function(f){ return {fase:f, cant:Math.min(cant, Math.max(0, l.cantidad-hecho(l,S.pieza,f)))}; });
  var menos=fases.filter(function(x){ return x.cant<cant; });
  fases=fases.filter(function(x){ return x.cant>0; });
  if(!fases.length){ $('err').textContent='Este lote ya tiene registradas todas esas fases.'; return; }
  if(menos.length) av.push('En '+menos.slice(0,4).map(function(x){ return nomFase(x.fase); }).join(', ')+(menos.length>4?' y otras':'')+' el lote ya tenía piezas registradas: ahí solo se suman las que faltan.');
  if(cant>l.cantidad) av.push('Usas '+cant+' y el lote es de '+l.cantidad+'.');
  var rec={ id:uid(), tipo:'avance', nombre:S.nombre, ts:fechaRegistro(), folio:l.folio, pieza:S.pieza, fase:fase, cantidad:cant, danadas:0, comentario:'',
            adel:{ modelo:a.modelo, faseOrigen:a.fase, color:a.color, fases:fases } };
  preguntar([['Lote',corto(l.folio)],['Pieza',nomPieza(S.pieza)],['Adelantadas que usas',cant],['Cuentan como hechas hasta',nomFase(fase)]], av,
    function(){ encolar(rec, corto(l.folio)+' · Usó '+cant+' adelantadas · '+nomPieza(S.pieza)+' · hasta '+nomFase(fase), 'avance'); },
    { titulo:'¿Usar estas piezas?', sub:'Se descuentan del estante', si:ic('check',22,0,3)+'Sí, usar' });
}
/* Pantalla del encargado: lo que hay en el estante */
function adelantadas(){
  var A=adelStock().slice().sort(function(x,y){ return x.modelo<y.modelo?-1:x.modelo>y.modelo?1:0; });
  var h='<button class="back" onclick="menu()">'+ic('back',18,0,3)+'Inicio</button><h2>Piezas adelantadas</h2>'+
    '<p class="sub">Piezas que sobraron o regresaron y se guardaron en el estante. Cuando alguien abre un lote del mismo modelo, la app le ofrece usarlas.</p>'+
    (servidorConAdel()?'<button class="big b1" onclick="altaAdel()">'+ic('plus',28)+'<span>Guardar piezas en el estante<small>Sobrantes, devoluciones o urnas a medio proceso</small></span></button>':
      '<div class="card err"><b>Primero actualiza el servidor.</b> Para usar Piezas adelantadas hay que pegar el Code.gs 4.13 en Apps Script y crear una Nueva versión.</div>');
  if(!A.length) h+='<div class="card">No hay piezas adelantadas en el estante.</div>';
  S.adelLista=A;
  var ms=[]; A.forEach(function(a){ if(ms.indexOf(a.modelo)<0) ms.push(a.modelo); });
  if(S.fModeloA && ms.indexOf(S.fModeloA)<0) S.fModeloA='';
  if(ms.length>1) h+='<select class="filtro-sel" aria-label="Filtrar por modelo" onchange="S.fModeloA=this.value;adelantadas()"><option value="">Todos los modelos</option>'+ms.map(function(m){ return '<option'+(S.fModeloA===m?' selected':'')+'>'+esc(m)+'</option>'; }).join('')+'</select>';
  A.forEach(function(a,k){
    if(S.fModeloA && a.modelo!==S.fModeloA) return;
    h+='<div class="card reg adel-fila">'+silTile(a.modelo,a.color,44)+'<div><b>'+a.cantidad+' · '+esc(nomPieza(a.pieza))+'</b> · '+esc(a.modelo)+'<br><small>Llegaron a '+esc(nomFase(a.fase))+' · '+esc(a.color)+'</small></div>'+
       '<button class="bR chico" onclick="altaAdel('+k+',\'Baja\')">Sacar</button></div>';
  });
  if(servidorConAdelantos()){
    var abiertos=(S.datos.lotes||[]).filter(function(l){ return l.adelanto; });
    h+='<h3 class="sec">Adelantar producción (sin pedido)</h3><p class="sub">Para trabajar urnas sin orden de compra. Se trabajan hasta antes de mandar a fondo y entran solas a este estante.</p>'+
       '<button class="big b2" onclick="abrirAdelanto()">'+ic('plus',28)+'<span>Abrir un adelanto<small>Modelo y cuántas urnas</small></span></button>';
    S.adelAbiertos=abiertos;
    abiertos.forEach(function(l,k){
      var a=avanceLote(l), p=Math.round(Math.min(1,(a.Corte+a.Lijado)/2)*100);
      h+='<div class="card reg adel-fila">'+silTile(l.modelo,'Sin pintar',44)+'<div><b>'+esc(corto(l.folio))+'</b><br><small>'+l.cantidad+' urnas · '+esc(l.estado)+' · '+p+'%</small></div>'+
         '<button class="b2 chico" onclick="cerrarAdelanto('+k+')">Cerrar</button></div>';
    });
  }
  h+='<p class="sub">Todo queda en las pestañas <b>Adelantadas</b> y <b>Adelantos</b> de la hoja.</p>';
  pantalla(h);
}
function servidorConAdelantos(){ return S.datos && !versionMenor(S.datos.version,'4.19'); }
function abrirAdelanto(){
  var ms=(S.datos.modelos||[]).map(function(m){ return m.nombre; });
  var h='<button class="back" onclick="adelantadas()">'+ic('back',18,0,3)+'Piezas adelantadas</button><h2>Abrir un adelanto</h2>'+
    '<p class="sub">Aparece en <b>Lotes</b>, en la sección "Sin pedido · Adelantos". Se registra igual que un lote, pero solo hasta antes de mandar a fondo.</p>'+
    '<label class="paso"><i>1</i>Modelo</label><select id="aoMod">'+ms.map(function(m){ return '<option>'+esc(m)+'</option>'; }).join('')+'</select>'+
    '<label class="paso"><i>2</i>¿Cuántas urnas?</label>'+stepper('cant',0,true)+
    '<label>Nota (opcional)</label><input type="text" id="aoNota" maxlength="150" placeholder="Ej. para el pedido de diciembre">'+
    '<div class="fijo"><div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarAdelanto()">'+ic('check',24,0,3)+'<span>Abrir adelanto</span></button></div></div>';

function guardarAdelanto(){
  var m=$('aoMod').value, cant=parseInt($('cant').value,10)||0, nota=$('aoNota').value.trim();
  if(!m){ $('err').textContent='Elige el modelo.'; return; }

  preguntar([['Modelo',m],['Urnas',cant]].concat(nota?[['Nota',nota]]:[]), [], function(){
    encolar({ id:uid(), tipo:'adelanto', mov:'Abrir', nombre:S.nombre, ts:new Date().toISOString(), modelo:m, cantidad:cant, nota:nota }, 'Abrió adelanto · '+cant+' '+m, 'adelanto');
  }, { titulo:'¿Abrir este adelanto?', sub:'Se trabaja sin pedido, hasta antes de mandar a fondo', si:ic('check',22,0,3)+'Sí, abrir' });
}
function cerrarAdelanto(k){
  var l=S.adelAbiertos[k]; if(!l) return;
  preguntar([['Adelanto',corto(l.folio)],['Estado',l.estado]], [l.estado!=='Terminado'?'Todavía no termina: lo que no se haya registrado hasta la última fase no entra al estante.':''], function(){
    encolar({ id:uid(), tipo:'adelanto', mov:'Cerrar', nombre:S.nombre, ts:new Date().toISOString(), folio:l.folio, cantidad:0 }, 'Cerró adelanto · '+corto(l.folio), 'adelanto');
  }, { titulo:'¿Cerrar este adelanto?', sub:'Deja de aparecer en Lotes. Lo que ya entró al estante se queda.', si:'Sí, cerrar', peligro:true });
}
/* Alta (guardar en el estante) o baja (sacar: se dañaron o se contaron mal) */
function altaAdel(k,mov){
  mov=mov||'Alta';
  if(mov==='Baja'){ var a=S.adelLista[k]; S.ad={mov:'Baja', modelo:a.modelo, pieza:a.pieza, fase:a.fase, color:a.color, max:a.cantidad}; }
  else if(!S.ad || S.ad.mov!=='Alta' || k===undefined){ var m0=(S.datos.modelos||[])[0]; S.ad={mov:'Alta', modelo:m0?m0.nombre:'', pieza:'Wakal', fase:'', color:'Sin pintar'}; }
  pintarAltaAdel();
}
function modeloInfo(n){ return (S.datos.modelos||[]).filter(function(m){ return m.nombre===n; })[0]||{nombre:n,techo:false}; }
function fasesPara(modelo,pieza){
  var t=modeloInfo(modelo).techo; if(pieza==='Techo' && !t) return [];
  return (S.datos.fases[pieza]||[]).filter(function(f){ return (t || !/\(si lleva\)/i.test(f)) && faseAplica(modelo,pieza,f); });
}
function pintarAltaAdel(){
  var d=S.ad, baja=d.mov==='Baja';
  var h='<button class="back" onclick="adelantadas()">'+ic('back',18,0,3)+'Piezas adelantadas</button><h2>'+(baja?'Sacar del estante':'Guardar piezas en el estante')+'</h2>';
  if(baja){
    h+='<div class="card adel-aviso">'+silTile(d.modelo,d.color,44)+'<div><b>'+esc(nomPieza(d.pieza))+' · '+esc(d.modelo)+'</b><small>Llegaron a '+esc(nomFase(d.fase))+' · '+esc(d.color)+' · hay '+d.max+'</small></div></div>'+
       '<label class="paso"><i>1</i>¿Cuántas sacas?</label>'+stepper('cant',0,true)+'<label>¿Por qué? (se dañaron, se contaron mal…)</label><input type="text" id="adNota" maxlength="150">';
  } else {
    var piezas=PIEZAS.filter(function(p){ return p[0]!=='Techo' || modeloInfo(d.modelo).techo; });
    if(!piezas.some(function(p){ return p[0]===d.pieza; })) d.pieza='Wakal';
    var fs=fasesPara(d.modelo,d.pieza); if(fs.indexOf(d.fase)<0) d.fase=fs[0]||'';
    h+='<div class="adel-prev">'+silTile(d.modelo,d.color,56)+'</div>';

var NIVEL={ 'CRÍTICO':['rojo',dot('rojo'),'Queda poco'], 'POR AGOTARSE':['amarillo',dot('amarillo'),'Ya casi se acaba'], 'ESTABLE':['verde',dot('verde'),'Hay suficiente'] };

/* ---------- siluetas de los modelos (dibujadas del catálogo), pintadas del color del lote ---------- */
var COLOR_URNA={ sin:'#CDB28A', chocolate:'#2B2522', blanco:'#F6F5F1', blanca:'#F6F5F1', rosa:'#E5679A', celeste:'#6E9FE3', vintage:'#B3AE93',
  ocre:'#C98A3C', cherry:'#6E2B2B', nogal:'#8A6440', gris:'#6F6B69', arena:'#D3C7B9' };
function tono(hex,f){ /* f<0 oscurece, f>0 aclara */
  var n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  var m=function(c){ return Math.round(f<0?c*(1+f):c+(255-c)*f); };
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
function formaModelo(modelo){
  var m=norm(modelo);
  var tam=/\bxl\b|extra/.test(m)?1:/grande/.test(m)?0.92:/mediana/.test(m)?0.84:/chic|mini/.test(m)?0.74:0.84;
  if(/pajaro/.test(m)) return {f:'pajaro',t:1};
  if(/casa nueva/.test(m)) return {f:'nueva',t:1};
  if(/casita|^casa/.test(m)) return {f:'casita',t:1};
  if(/arte/.test(m)) return {f:'arte',t:tam};
  if(/porta ?retrato vertical/.test(m)) return {f:'vertical',t:1};
  if(/porta ?retrato/.test(m)) return {f:'cubo',t:1};
  if(/huella/.test(m)) return {f:'huella',t:1};
  if(/clasica chica|sencilla/.test(m)) return {f:'clasica',t:/mini/.test(m)?0.8:1};
  if(/clasica/.test(m)) return {f:'rect',t:tam};
  return {f:'clasica',t:1};
}
function silueta(modelo,color,px){
  var c=COLOR_URNA[norm(color).split(' ')[0]]||'#9AA6B2', o=tono(c,-0.38), cl=tono(c,0.22), cd=tono(c,-0.14);
  if(norm(color).indexOf('blanc')===0){ o='#8E99A6'; cd='#E6E4DE'; }
  var F=formaModelo(modelo), t=F.t, s='';
  var R=function(x,y,w,h,f,r){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r||1)+'" fill="'+(f||c)+'" stroke="'+o+'" stroke-width="1.4"/>'; };
  var P=function(pts,f){ return '<polygon points="'+pts+'" fill="'+(f||c)+'" stroke="'+o+'" stroke-width="1.4" stroke-linejoin="round"/>'; };
  var foto=function(x,y,w,h,arco){ var d=arco?'M'+x+' '+(y+h)+'V'+(y+w/2)+'a'+(w/2)+' '+(w/2)+' 0 0 1 '+w+' 0V'+(y+h)+'Z':'M'+x+' '+y+'h'+w+'v'+h+'h-'+w+'Z';
    return '<path d="'+d+'" fill="#DCE6EF" stroke="'+o+'" stroke-width="1.2"/><circle cx="'+(x+w/2)+'" cy="'+(y+h*0.62)+'" r="'+Math.min(w,h)*0.17+'" fill="#B7C6D4"/>'; };
  var base=function(w){ return R(32-w/2,57,w,4,cd,1); };
  if(F.f==='clasica'){ var w=34*t,h=32*t; s=base(w+6)+R(32-w/2,57-h,w,h)+R(32-w/2-1.5,57-h-2,w+3,3,cl,1); }
  else if(F.f==='rect'){ var w=52*t,h=34*t; s=base(w+6)+R(32-w/2,57-h,w,h)+R(32-w/2-1.5,57-h-2,w+3,3,cl,1); }
  else if(F.f==='casita'||F.f==='pajaro'){ var w=34,h=F.f==='pajaro'?26:24,top=57-h;
    s=base(w+8)+R(32-w/2,top,w,h,c,0)+P((32-w/2-5)+','+(top+2)+' 32,'+(top-20)+' '+(32+w/2+5)+','+(top+2)+' '+(32+w/2+2)+','+(top+4)+' 32,'+(top-16)+' '+(32-w/2-2)+','+(top+4),cl)+
      P((32-w/2)+','+(top+1)+' 32,'+(top-16)+' '+(32+w/2)+','+(top+1));
    if(F.f==='pajaro') s+=foto(32-9,top+5,18,h-7,true); }
  else if(F.f==='nueva'){ var w=30,h=38,top=57-h; s=base(w+6)+R(32-w/2,top,w,h,c,0)+P((32-w/2-3)+','+(top+2)+' '+(32+w/2+5)+','+(top-7)+' '+(32+w/2+5)+','+(top-3)+' '+(32-w/2-3)+','+(top+6),cl)+foto(32-8,top+12,16,h-16,false); }
  else if(F.f==='arte'){ var w=t>=1?34:30,h=t>=1?50:t>=0.9?44:t>0.8?37:30,top=57-h,x0=32-w/2,x1=32+w/2;
    s=base(w+6)+P(x0+','+57+' '+x0+','+(top+9)+' '+(x0+w*0.42)+','+top+' '+x1+','+(top+7)+' '+x1+','+57)+P(x0+','+(top+9)+' '+(x0+w*0.42)+','+top+' '+(x0+w*0.55)+','+(top+12),cl); }
  else if(F.f==='cubo'){ var w=34,h=30,top=57-h; s=base(w+6)+R(32-w/2,top,w,h,c,0)+R(32-w/2-1.5,top-3,w+3,4,cl,1)+foto(32-11,top+5,22,h-9,false); }
  else if(F.f==='vertical'){ var w=32,h=42,top=57-h; s=base(w+6)+R(32-w/2,top,w,h,c,0)+R(32-w/2-1.5,top-3,w+3,4,cl,1)+foto(32-11,top+6,22,h-11,false); }
  else if(F.f==='huella'){ s=base(40)+R(14,26,36,31,c,4)+'<g fill="'+o+'"><ellipse cx="32" cy="46" rx="6" ry="5"/><circle cx="24" cy="38" r="2.6"/><circle cx="29" cy="34" r="2.6"/><circle cx="35" cy="34" r="2.6"/><circle cx="40" cy="38" r="2.6"/></g>'; }
  px=px||44;
  return '<svg class="sil-svg" role="img" aria-label="'+esc(modelo+' '+color)+'" width="'+px+'" height="'+px+'" viewBox="3 4 58 58">'+s+'</svg>';
}

/* Filtros del buscador: por semáforo (si la lista lo tiene) y por modelo (si hay varios) */
function filtrosBuscador(id,items){

  items.forEach(function(x){ if(x.nivel) nv[x.nivel[0]]=(nv[x.nivel[0]]||0)+1; if(x.grupo && gr.indexOf(x.grupo)<0) gr.push(x.grupo); });

      gr.map(function(g){ return '<option>'+esc(g)+'</option>'; }).join('')+'</select>';

function filtroNivel(id,c){

function pasaFiltro(P,x){ return (!P.fNivel || (x.nivel&&x.nivel[0]===P.fNivel)) && (!P.fGrupo || x.grupo===P.fGrupo); }
function opcionHtml(id,x,i){
  var n=x.nivel;

function pintarOpciones(id){
  var P=S.pick[id], q=norm($(id+'_q').value).split(/\s+/).filter(Boolean), h='', n=0, filtro=!!(P.fNivel||P.fGrupo);
  if(q.length){
    P.items.forEach(function(x,i){ if(!pasaFiltro(P,x)) return; var t=norm(x.titulo+' '+(x.sub||'')+' '+(x.extra||'')+' '+(x.grupo||'')); if(q.every(function(w){return t.indexOf(w)>=0;})){ if(n<8) h+=opcionHtml(id,x,i); n++; } });
    if(!n) h='<div class="card">No encontré nada con ese nombre'+(filtro?' con ese filtro':'')+'. Toca <b>Ver toda la lista</b>.</div>';
    else if(n>8) h+='<div class="sub">…y '+(n-8)+' más. Escribe más letras para ver menos.</div>';
  } else if(P.todos || filtro){
    P.items.forEach(function(x,i){ if(pasaFiltro(P,x)){ h+=opcionHtml(id,x,i); n++; } });
    if(!n) h='<div class="card">No hay nada con ese filtro.</div>';
  }
  $(id+'_res').innerHTML=h;

/* Todo registro pasa primero por el celular: si no hay internet, ahí se queda hasta que se pueda enviar */
function encolar(rec, resumen, tipo){
  if(S.papel && $('quien') && $('quien').value && $('quien').value!==S.nombre){ rec.capturo=S.nombre; rec.nombre=$('quien').value; resumen=rec.nombre+' · '+resumen; }

  google.script.run
    .withSuccessHandler(function(){ setCola(cola().filter(function(r){return r.id!==rec.id;})); histMarcar(rec.id,'enviado'); enLinea=true; pintarEstado(); confirmar(true,resumen); enviarPendientes(); })
    .withFailureHandler(function(err){

      if(/cantidad|no válid|No encuentro/i.test(msg)){ setCola(cola().filter(function(r){return r.id!==rec.id;})); histMarcar(rec.id,'rechazado'); pantalla('<div class="card err">No se guardó: '+esc(msg)+'</div><button class="big b2" onclick="menu()">Volver</button>'); return; }

/* Achica la foto para que no pese (máx. 1280 px) */
function leerFoto(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var M=1280, w=img.width, h=img.height, k=Math.min(1,M/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.foto=c.toDataURL('image/jpeg',0.7);
      $('pfoto').innerHTML='<img src="'+S.foto+'" style="max-width:100%;border-radius:6px;margin-top:8px"><button class="link" onclick="S.foto=null;$(\'pfoto\').innerHTML=\'\'">Quitar foto</button>';
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}

  setTimeout(filtrarRegs,0);
  return h;
}
function filtrarRegs(){
  var d=S.panelDatos||{}, q=$('fquien')?$('fquien').value:'', h='';
  (d.ultimos||[]).filter(function(r){ return !q || r.nombre===q; }).forEach(function(r){
    h+='<div class="card reg"><div><small>'+esc(r.cuando)+' · '+esc(r.nombre)+'</small><br>'+esc(r.texto)+'</div><button class="bR chico" onclick="anularReg(\''+esc(r.id)+'\', anularRegistros)">Anular</button></div>';
  });
  if($('listaRegs')) $('listaRegs').innerHTML = h || '<div class="card">No hay registros.</div>';
}
function problemasEnc(){ cargarPanel('Problemas reportados', problemasHtml); }
function problemasHtml(d){
  var ps=d.problemas||[];
  if(!ps.length) return '<div class="card">No hay problemas pendientes</div>';
  return '<p class="sub">Pendientes ('+ps.length+'). Cuando ya esté arreglado, márcalo como resuelto.</p>'+ps.map(function(p){
    return '<div class="card"><small>'+esc(p.fecha)+' · '+esc(p.quien)+' · '+esc(p.tipo)+(p.lote?' · '+esc(corto(p.lote)):'')+'</small><br>'+esc(p.desc)+
      (/^https?:/.test(p.foto)?'<br><a href="'+esc(p.foto)+'" target="_blank" rel="noopener">Ver foto</a>':(p.foto?'<br><small>La foto está en tu correo</small>':''))+
      '<div class="btnrow"><button class="b3" onclick="resolverProb(\''+esc(p.id)+'\')">✓ Marcar resuelto</button></div></div>';
  }).join('');
}
/* Avance de un grupo de lotes en cada área (0 a 1), ponderado por cantidad */
function avanceGrupo(ls){
  var t=0, r={Corte:0,Lijado:0,Pintura:0,Empacado:0};
  ls.forEach(function(l){ var a=avanceLote(l); t+=l.cantidad; AREAS.forEach(function(k){ r[k]+=a[k]*l.cantidad; }); r.Empacado+=Math.min(l.empacadas||0,l.cantidad); });
  if(t) Object.keys(r).forEach(function(k){ r[k]/=t; });
  r.urnas=t; return r;
}
function barras(a, chico, yo, solo){
  return (solo||AREAS.concat(['Empacado'])).map(function(k){
    var p=Math.round(a[k]*100);
    return '<div class="av-fila'+(k===yo?' yo':'')+'"'+(chico?' style="font-size:12px;margin:3px 0"':'')+'><span class="av-nom">'+k+'</span><span class="av-barra"'+(chico?' style="height:9px"':'')+'><i style="width:'+p+'%;background:'+COLOR_AREA[k]+'"></i></span><span class="av-pct">'+p+'%</span></div>';
  }).join('');
}
function progresoAreas(){
  if(!esAdmin()) return menu();
  var h='<button class="back" onclick="vistaEncargado()">'+ic('back',18,0,3)+'Vista de encargado</button><h2>Progreso por área</h2><p class="sub">Según la última fase registrada de cada pieza. Empacado = urnas empacadas.</p>';
  var ocs=S.datos.ocs||[];
  if(!ocs.length) h+='<div class="card">No hay pedidos activos.</div>';
  ocs.forEach(function(oc){
    var ls=S.datos.lotes.filter(function(l){ return l.oc===oc; }); if(!ls.length) return;
    var a=avanceGrupo(ls), atr=ls.filter(function(l){ return l.estado==='Atrasado'; }).length;
    h+='<div class="card avance"><div class="av-tit">Pedido <b>'+esc(oc)+'</b> · '+a.urnas+' urnas · '+ls.length+' lotes'+(atr?' · <span style="color:var(--red)">'+atr+' atrasado(s)</span>':'')+'</div>'+barras(a)+'</div>';
    var sems={}; ls.forEach(function(l){ (sems[l.semana]=sems[l.semana]||[]).push(l); });
    var lista=function(sm){ return sems[sm].every(function(l){ return l.estado==='Terminado' || (l.empacadas||0)>=l.cantidad; }); };
    Object.keys(sems).sort(function(x,y){ return (lista(x)-lista(y)) || ((Number(x)||0)-(Number(y)||0)); }).forEach(function(sm){
      var g=sems[sm], ag=avanceGrupo(g), ok=lista(sm);
      h+='<div class="card'+(ok?' sem-ok':'')+'"><b>'+(ok?'✓ ':'')+'Semana '+esc(sm)+(ok?' · terminada':'')+'</b> <span class="sub">· '+ag.urnas+' urnas</span>'+barras(ag,true)+
         '<details style="margin-top:6px"><summary class="sub">Ver cada lote ('+g.length+')</summary>'+
         g.map(function(l){ var al=avanceLote(l), e=Math.round(Math.min(l.empacadas||0,l.cantidad)/(l.cantidad||1)*100);
           return '<div style="margin-top:8px"><b style="font-size:13px">'+esc(corto(l.folio))+'</b> '+tagEstado(l.estado)+'<div class="mini" style="font-size:12px">'+
             AREAS.map(function(k){ return '<em style="font-style:normal;margin-right:8px;color:'+COLOR_AREA[k]+'">'+k+' '+Math.round(al[k]*100)+'%</em>'; }).join('')+
             '<em style="font-style:normal;color:'+COLOR_AREA.Empacado+'">Empacado '+e+'%</em></div></div>'; }).join('')+
         '</details></div>';
    });
  });
  pantalla(h);
}
/* ---------- panel del encargado ---------- */
function panelEncargado(){
  if(!esAdmin()) return menu();
  var h='<button class="back" onclick="vistaEncargado()">'+ic('back',18,0,3)+'Vista de encargado</button><h2>Panel del encargado</h2>'+barrasAvance();
  var atr=(S.datos.lotes||[]).filter(function(l){ return l.estado==='Atrasado'; });
  h+='<div class="card"><b>Lotes atrasados ('+atr.length+')</b><br>'+(atr.length?atr.map(function(l){ return esc(corto(l.folio))+' <small>(semana '+esc(l.semana)+')</small>'; }).join('<br>'):'<span class="sub">Ninguno</span>')+'</div>';
  var cortar=Object.keys(S.datos.estante||{}).filter(function(k){ return S.datos.estante[k].estado==='CORTAR YA'; });
  h+='<div class="card"><b>'+dot('rojo')+' Piezas que hay que cortar ya ('+cortar.length+')</b><br>'+(cortar.length?cortar.slice(0,25).map(esc).join('<br>')+(cortar.length>25?'<br>…':''):'<span class="sub">Ninguna</span>')+'</div>';
  if(S.datos.almacen){
    var rojo=[], amar=[];
    Object.keys(S.datos.almacen).forEach(function(a){ S.datos.almacen[a].forEach(function(x){ if(x.estado==='CRÍTICO') rojo.push(x); else if(x.estado==='POR AGOTARSE') amar.push(x); }); });
    h+='<div class="card"><b>Material para comprar</b><br>'+(rojo.length||amar.length?rojo.map(function(x){ return ''+dot('rojo')+' '+esc(x.nombre)+' <small>(quedan '+x.existencia+' '+esc(x.unidad)+')</small>'; }).concat(amar.map(function(x){ return ''+dot('amarillo')+' '+esc(x.nombre)+' <small>(quedan '+x.existencia+' '+esc(x.unidad)+')</small>'; })).join('<br>'):'<span class="sub">Todo bien de existencia</span>')+'</div>';
  }
  h+='<div id="panelSrv"><p class="sub">Cargando registros y problemas…</p></div>';
  pantalla(h);
  google.script.run
    .withSuccessHandler(function(d){ if($('panelSrv')) $('panelSrv').innerHTML=panelSrvHtml(d); })
    .withFailureHandler(function(err){ if($('panelSrv')) $('panelSrv').innerHTML='<div class="card">Sin internet: no se pueden ver los registros del día ni los problemas.<br><small>'+esc(String(err&&err.message||err).replace(/^SIN_RED:\s*/,''))+'</small></div>'; })
    .panel({ nombre:S.nombre, firma:S.firma });
}
function panelSrvHtml(d){
  var h='';
  h+='<div class="card"><b>Registros de hoy</b><br>'+(Object.keys(d.registrosHoy||{}).map(function(n){ return esc(n)+': '+d.registrosHoy[n]; }).join(' · ')||'<span class="sub">Nadie ha registrado hoy</span>')+
     (d.sinRegistro&&d.sinRegistro.length?'<div class="warn" style="margin-top:8px">Sin registrar hoy: '+d.sinRegistro.map(esc).join(', ')+'</div>':'')+'</div>';
  h+='<div class="card"><b>Problemas sin resolver ('+(d.problemas||[]).length+')</b>';
  (d.problemas||[]).forEach(function(p){
    h+='<div class="prob"><small>'+esc(p.fecha)+' · '+esc(p.quien)+' · '+esc(p.tipo)+(p.lote?' · '+esc(corto(p.lote)):'')+'</small><br>'+esc(p.desc)+
       (/^https?:/.test(p.foto)?'<br><a href="'+esc(p.foto)+'" target="_blank" rel="noopener">Ver foto</a>':(p.foto?'<br>Foto en tu correo':''))+
       '<br><button class="link" onclick="resolverProb(\''+esc(p.id)+'\')">✓ Marcar resuelto</button></div>';
  });
  if(!(d.problemas||[]).length) h+='<br><span class="sub">Ninguno</span>';
  h+='</div><div class="card"><b>Últimos registros</b><p class="sub" style="margin:4px 0">Puedes anular cualquiera si está mal.</p>';
  (d.ultimos||[]).forEach(function(r){
    h+='<div class="reg"><div><small>'+esc(r.cuando)+' · '+esc(r.nombre)+'</small><br>'+esc(r.texto)+'</div><button class="bR chico" onclick="anularReg(\''+esc(r.id)+'\', panelEncargado)">Anular</button></div>';
  });
  return h+'</div>';
}
function resolverProb(id){
  google.script.run.withSuccessHandler(function(){ problemasEnc(); }).withFailureHandler(function(e){ alert('No se pudo: '+String(e&&e.message||e)); }).resolver({ id:id, nombre:S.nombre, firma:S.firma });
}

/* ---------- modo oscuro: Automático (como el celular) / Oscuro / Claro ---------- */
var TEMAS={auto:ic('half',16)+'Tema: automático', oscuro:ic('moon',16)+'Tema: oscuro', claro:ic('sun',16)+'Tema: claro'};
function aplicarTema(){
  var t=leer('tema','claro'), sis=window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  var osc = t==='oscuro' || (t==='auto' && sis);
  document.body.classList.toggle('oscuro', osc);
  var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', '#15304F');
}
function cambiarTema(){ var orden=['claro','oscuro','auto'], t=leer('tema','claro'); guardar('tema', orden[(orden.indexOf(t)+1)%3]); aplicarTema(); menu(); }
if(window.matchMedia){ var mq=matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change',aplicarTema); else if(mq.addListener) mq.addListener(aplicarTema); }
aplicarTema();

/* ---------- arranque ---------- */
pintarEstado();
cargarDatos(function(){ inicio(); enviarPendientes(); });
</script>
