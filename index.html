<body>
<header>
  <h1 onclick="toqueTitulo()" style="-webkit-user-select:none;user-select:none;cursor:default">Producción de urnas</h1>
  <span id="estado" class="pill">Conectando…</span>
</header>
<main id="app"><p>Cargando…</p></main>

<script>
/* ====== Conexión con tu hoja de Google (Apps Script) ======
   Si algún día cambias el enlace de Apps Script, cámbialo solo aquí. */
var API_URL = 'https://script.google.com/macros/s/AKfycbxJx7SON8zk1Cg_Kz1qXxUC-HbdBosEfj27PFDOpbeavj2bDZT6XF52Gx-NRSSadoPF/exec';
var VERSION = '3.6';

function llamarApi(accion, rec){
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 20000);
  var p = accion==='datos'
    ? fetch(API_URL+'?accion=datos&t='+Date.now(), {signal: ctrl&&ctrl.signal})
    : fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                      body: JSON.stringify({accion:accion, rec:rec}), signal: ctrl&&ctrl.signal});
  return p.then(function(r){ return r.text(); })
    .then(function(txt){
      clearTimeout(t);
      var j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('SIN_RED: respuesta no válida (revisa que Apps Script tenga acceso "Cualquier usuario")'); }
      if(!j.ok) throw new Error(j.error||'Error desconocido');
      return accion==='datos' ? j.datos : j;
    }, function(err){ clearTimeout(t); throw new Error('SIN_RED: '+(err&&err.message||err)); });
}
/* Imita google.script.run para que el resto de la app no cambie */
function Runner(){ this.ok=null; this.fail=null; }
Runner.prototype.withSuccessHandler=function(f){ this.ok=f; return this; };
Runner.prototype.withFailureHandler=function(f){ this.fail=f; return this; };
Runner.prototype._go=function(accion,rec){ var me=this;
  llamarApi(accion,rec).then(function(r){ me.ok&&me.ok(r); }, function(e){ me.fail&&me.fail(e); }); };
Runner.prototype.getData=function(){ this._go('datos'); };
Runner.prototype.registrar=function(rec){ this._go('registrar',rec); };
Runner.prototype.anular=function(rec){ this._go('anular',rec); };
Runner.prototype.panel=function(rec){ this._go('panel',rec); };
Runner.prototype.resolver=function(rec){ this._go('resolver',rec); };
var google={script:{}};
Object.defineProperty(google.script,'run',{get:function(){ return new Runner(); }});

/* Funciona sin internet: guarda la app en el celular */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
/* Cuando sale una versión nueva de la app, se recarga sola (solo si no estás llenando un registro) */
if('serviceWorker' in navigator){
  var teniaVersion=!!navigator.serviceWorker.controller, yaRecargo=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!teniaVersion || yaRecargo) return;
    if(document.getElementById('cant') || document.querySelector('.teclado')) return;
    yaRecargo=true; location.reload();
  });
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }

/* Botón "Instalar app" */
var promptInstalar=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); promptInstalar=e; if(typeof S!=='undefined' && S.nombre && $('app').querySelector('.big')) menu(); });
function esInstalada(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone; }
function esIphone(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function instalar(){
  if(promptInstalar){ promptInstalar.prompt(); promptInstalar.userChoice.then(function(){ promptInstalar=null; menu(); }); return; }
  alert(esIphone() ? 'En Safari toca el botón Compartir (cuadro con flecha) y luego "Agregar a inicio".'
                   : 'Toca los 3 puntos ⋮ del navegador y luego "Instalar app" o "Agregar a pantalla principal".');
}
</script>
<script>
var S = { datos:null, nombre:null, lote:null, pieza:null, papel:false, ultimo:null };
var PIEZAS = [['Wakal','Huacal'],['Tapa','Tapa'],['Centro','Centro'],['Techo','Techo']];

/* ---------- almacenamiento en el celular ---------- */
var MEM = {};
function guardar(k,v){ try{ localStorage.setItem('urnas_'+k, JSON.stringify(v)); }catch(e){ MEM[k]=v; } }
function leer(k,def){ try{ var v=localStorage.getItem('urnas_'+k); return v?JSON.parse(v):def; }catch(e){ return MEM[k]!==undefined?MEM[k]:def; } }
function cola(){ return leer('cola',[]); }
function setCola(c){ guardar('cola',c); pintarEstado(); }
/* Historial de lo que se registró en este celular (para "Mis registros de hoy") */
function hist(){ return leer('hist',[]); }
function histMarcar(id,estado){ var h=hist(); h.forEach(function(x){ if(x.id===id) x.estado=estado; }); guardar('hist',h); }
function histAgregar(rec,resumen){
  var lim=Date.now()-3*86400000, h=hist().filter(function(x){ return x.t>lim; });
  h.push({ id:rec.id, tipo:rec.tipo, nombre:rec.nombre, por:S.nombre, resumen:resumen, t:Date.now(), estado:'pendiente' }); guardar('hist',h);
}

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9); }
function $(id){ return document.getElementById(id); }
function pantalla(html){ S.alCambiar=null; $('app').innerHTML=html; window.scrollTo(0,0); }
function corto(f){ return String(f).replace(/\s*\([^)]*\)\s*$/,''); }
function tagEstado(e){ var k=String(e||'').slice(0,3); return '<span class="tag t-'+esc(k)+'">'+esc(e||'')+'</span>'; }
function ahoraLocal(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }

/* ---------- conexión ---------- */
var enLinea = navigator.onLine;
function pintarEstado(){
  var n=cola().length, el=$('estado');
  if(!enLinea){ el.className='pill off'; el.textContent='Sin internet'+(n?' · '+n+' pendientes':''); }
  else if(n){ el.className='pill pend'; el.textContent=n+' por enviar…'; }
  else { el.className='pill'; el.textContent='En línea'; }
}
function hayScript(){ return typeof google!=='undefined' && google.script && google.script.run; }

function cargarDatos(cb){
  var cache=leer('datos',null);
  if(cache && !S.datos){ S.datos=cache; }
  if(!hayScript()){ enLinea=false; pintarEstado(); cb&&cb(); return; }
  google.script.run
    .withSuccessHandler(function(d){ S.datos=d; guardar('datos',d); enLinea=true; aplicarPendientesALotes(); pintarEstado(); cb&&cb(); })
    .withFailureHandler(function(err){
      enLinea=false; pintarEstado();
      if(!S.datos){ var m=String(err&&err.message||err); document.getElementById('app').innerHTML='<div class="card">'+(/SIN_RED/.test(m)&&!navigator.onLine?'<b>Abre la app una vez con internet</b> para que se descarguen los lotes. Después ya funciona sin señal.<br><br>Mientras tanto usa la <b>hoja de registro en papel</b>.':'<b style="color:#b00020">No pude leer la hoja.</b><br><br>'+esc(m)+'<br><br><small>Mándale una foto de esto a Karlo.</small>')+'<br><br><button class="big b1" onclick="actualizar()">Reintentar</button></div>'; return; }
      cb&&cb();
    })
    .getData();
}

var enviando=false;
function enviarPendientes(){
  if(enviando || !hayScript()) return;
  var c=cola(); if(!c.length){ pintarEstado(); return; }
  enviando=true;
  var rec=c[0];
  google.script.run
    .withSuccessHandler(function(){ var c2=cola().filter(function(r){return r.id!==rec.id;}); setCola(c2); histMarcar(rec.id,'enviado'); enLinea=true; enviando=false; enviarPendientes(); })
    .withFailureHandler(function(err){
      enviando=false;
      var msg=String(err&&err.message||err);
      if(/cantidad|no válid|No encuentro/i.test(msg)){ /* error de datos: se descarta para no trabar la cola */
        var c3=cola().filter(function(r){return r.id!==rec.id;}); setCola(c3); histMarcar(rec.id,'rechazado');
        alert('Un registro no se pudo guardar: '+msg);
      } else { enLinea=false; pintarEstado(); }
    })
    .registrar(rec);
}
setInterval(function(){ if(cola().length) enviarPendientes(); }, 30000);
window.addEventListener('online',function(){ enLinea=true; pintarEstado(); enviarPendientes(); cargarDatos(); });

function aplicarPendientesALotes(){
  if(!S.datos) return;
  cola().forEach(function(r){ if(r.tipo==='avance') (r.items||[{pieza:r.pieza,fase:r.fase}]).forEach(function(x){ avanzarLocal(r.folio,x.pieza,x.fase); sumarHecho(r.folio,x.pieza,x.fase,Number(r.cantidad)||0); }); });

function avanzarLocal(folio,pieza,fase){
  var l=(S.datos.lotes||[]).filter(function(x){return x.folio===folio;})[0];
  if(!l) return;
  var lista=S.datos.fases[pieza]||[];
  if(lista.indexOf(fase) > lista.indexOf(l.av[pieza])) l.av[pieza]=fase;
  if(l.estado==='Sin iniciar') l.estado='En proceso';
}

/* ---------- contraseña (PIN de 4 números) ---------- */
function sha256(texto){
  var ascii=unescape(encodeURIComponent(texto));
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp=Math.pow, mw=mp(2,32), i, j, res='', words=[], bitLen=ascii.length*8, hash=[], k=[], pc=0, comp={};
  for(var c=2;pc<64;c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/mw)|0); words[words.length]=bitLen;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; res+=((b<16)?0:'')+b.toString(16); }
  return res;
}
function conPin(){ return !!(S.datos && S.datos.claves); }
function esAdmin(){ return conPin() && (S.datos.admins||[]).indexOf(S.nombre)>=0; }
/* ¿La sesión guardada en este celular sigue siendo válida? (si Karlo cambia la contraseña, la vuelve a pedir) */
function sesionValida(){
  if(!conPin()) return true;
  var ses=leer('sesion',null);
  return !!(ses && ses.nombre===S.nombre && ses.ver===S.datos.claves[S.nombre]);
}

function inicio(){
  S.nombre=leer('nombre',null);
  if(!S.datos){ pantalla('<div class="card">No se pudieron cargar los datos. Revisa tu internet y vuelve a abrir la app.<br><br>Mientras tanto usa la <b>hoja de registro en papel</b>.</div>'); return; }

  S.firma=(leer('sesion',{})||{}).firma||null;
  menu();
}

function elegirNombre(){
  var h='<h2>¿Quién eres?</h2><p class="sub">Toca tu nombre</p><div class="grid2">';
  S.datos.nombres.forEach(function(n,i){ h+='<button class="name" onclick="setNombre('+i+')">'+esc(n)+'</button>'; });
  pantalla(h+'</div>');
}
function setNombre(i){
  var n=S.datos.nombres[i];
  if(!conPin()){ S.nombre=n; guardar('nombre',n); menu(); return; }
  if(!S.datos.claves[n]){ pantalla('<div class="card"><b>'+esc(n)+'</b>, todavía no tienes contraseña.<br><br>Pídele a Karlo que te la asigne y luego toca "Actualizar".</div><button class="big b1" onclick="actualizar()">Actualizar</button><button class="big b2" onclick="elegirNombre()">← Volver</button>'); return; }
  S.pinDe=n; S.pin=''; pantallaPin();
}
function pantallaPin(msg){
  var h='<button class="back" onclick="elegirNombre()">← Cambiar nombre</button><h2>Hola, '+esc(S.pinDe)+'</h2><p class="sub">Escribe tu contraseña de 4 números</p>'+
        '<div class="puntos">'+[0,1,2,3].map(function(i){ return '<span class="'+(i<S.pin.length?'on':'')+'"></span>'; }).join('')+'</div>'+
        '<div class="err" style="text-align:center;min-height:20px">'+(msg||'')+'</div><div class="teclado">';
  [1,2,3,4,5,6,7,8,9].forEach(function(d){ h+='<button onclick="tecla(\''+d+'\')">'+d+'</button>'; });
  h+='<span></span><button onclick="tecla(\'0\')">0</button><button onclick="tecla(\'B\')">⌫</button></div>';
  pantalla(h);
}
function tecla(d){
  if(d==='B'){ S.pin=S.pin.slice(0,-1); return pantallaPin(); }
  if(S.pin.length>=4) return;
  S.pin+=d;
  if(S.pin.length<4) return pantallaPin();
  var n=S.pinDe, ver=sha256(n+'|'+S.pin+'|ver');
  if(ver!==S.datos.claves[n]){ S.pin=''; return pantallaPin('Contraseña incorrecta. Intenta otra vez.'); }
  S.nombre=n; S.firma=sha256(n+'|'+S.pin+'|firma'); S.pin='';
  guardar('nombre',n); guardar('sesion',{nombre:n, ver:ver, firma:S.firma});
  menu();
}
function salir(){ guardar('sesion',null); S.firma=null; S.papel=false; elegirNombre(); }

/* ---------- áreas (Corte / Lijado / Pintura) ---------- */
var AREAS=['Corte','Lijado','Pintura'];
var COLOR_AREA={Corte:'#38761d',Lijado:'#bf9000',Pintura:'#674ea7',Empacado:'#1c4587'};
function miArea(){ var a=(S.datos.areaUsuarios||{})[S.nombre]; return (a && AREAS.indexOf(a)>=0) ? a : 'Todas'; }
/* Área cuyas fases ve en "Avance de un lote": cada quien las de su área; el encargado, las de Corte.
   En "Pasar hoja de papel" el encargado ve todas, porque captura lo de otros. */
function areaFases(){
  if(!S.datos.areasFases) return 'Todas';
  if(esAdmin()) return S.papel ? 'Todas' : 'Corte';
  return miArea();
}
function numFase(f){ var n=parseInt(String(f||'').slice(0,2),10); return isNaN(n)?0:n; }
function areaDeFase(pieza,fase){ var e=(S.datos.areasFases||[]).filter(function(x){ return x.pieza===pieza && x.fase===fase; })[0]; return e?e.area:null; }
/* Avance de un lote en cada área (0 a 1), con la última fase registrada de cada pieza */
function avanceLote(l){
  var r={}; AREAS.forEach(function(a){ var tot=0, hec=0;
    (S.datos.areasFases||[]).forEach(function(e){
      if(e.area!==a) return;
      if(e.pieza==='Empacado'){ tot++; hec+=l.cantidad?Math.min(1,(l.empacadas||0)/l.cantidad):0; return; }
      if(e.techo && !l.techo) return;
      tot++; if(e.n<=numFase(l.av[e.pieza])) hec++;
    });
    r[a]=tot?hec/tot:1; });
  return r;
}
function avancePedido(oc){
  var t=0, r={Corte:0,Lijado:0,Pintura:0,Empacado:0};
  S.datos.lotes.forEach(function(l){ if(l.oc!==oc) return; var a=avanceLote(l); t+=l.cantidad;
    AREAS.forEach(function(k){ r[k]+=a[k]*l.cantidad; }); r.Empacado+=Math.min(l.empacadas||0,l.cantidad); });
  if(t) Object.keys(r).forEach(function(k){ r[k]/=t; });
  r.urnas=t; return r;
}
function barrasAvance(){
  if(!S.datos.areasFases) return '';
  var h='', yo=miArea();
  (S.datos.ocs||[]).forEach(function(oc){
    var a=avancePedido(oc); if(!a.urnas) return;
    h+='<div class="card avance"><div class="av-tit">Avance del pedido <b>'+esc(oc)+'</b> · '+a.urnas+' urnas</div>';
    AREAS.concat(['Empacado']).forEach(function(k){
      var p=Math.round(a[k]*100);
      h+='<div class="av-fila'+(k===yo?' yo':'')+'"><span class="av-nom">'+k+(k===yo?' (tu área)':'')+'</span><span class="av-barra"><i style="width:'+p+'%;background:'+COLOR_AREA[k]+'"></i></span><span class="av-pct">'+p+'%</span></div>';
    });
    h+='</div>';
  });
  return h;
}

function filtrarLotes(f){
  f=norm(f).split(/\s+/).filter(Boolean);
  var grupos={}, orden=[], h='';
  S.datos.lotes.forEach(function(l,i){
    var t=norm(l.folio); if(f.length && !f.every(function(w){ return t.indexOf(w)>=0; })) return;
    if(miArea()!=='Todas' && !S.verTodo && avanceLote(l)[miArea()]>=1) return;
    var k=l.oc+'|'+l.semana; if(!grupos[k]){ grupos[k]=[]; orden.push(k); } grupos[k].push(i);
  });
  orden.sort(function(a,b){ var A=a.split('|'),B=b.split('|'); return A[0]===B[0] ? (Number(A[1])||0)-(Number(B[1])||0) : (A[0]<B[0]?-1:1); });
  /* Una semana está completa cuando todos sus lotes ya están empacados (Terminado):
     esas se van al final, en verde y plegadas, para que no estorben */
  var semanaLista=function(k){ var p=k.split('|');
    var ls=S.datos.lotes.filter(function(l){ return l.oc===p[0] && String(l.semana)===p[1]; });
    return ls.length>0 && ls.every(function(l){ return l.estado==='Terminado' || (l.empacadas||0)>=l.cantidad; }); };
  var activas=orden.filter(function(k){ return !semanaLista(k); }), listas=orden.filter(semanaLista);
  var pintarSemana=function(k, verde){
    var p=k.split('|'), ids=grupos[k], tot=0, emp=0, r='';
    ids.forEach(function(i){ tot+=S.datos.lotes[i].cantidad; emp+=Math.min(S.datos.lotes[i].empacadas||0,S.datos.lotes[i].cantidad); });
    r+='<div class="oc semana'+(verde?' lista':'')+'">'+(verde?'✔ ':'')+'SEMANA '+esc(p[1])+(verde?' · TERMINADA':'')+'<span>'+(verde?'Pedido '+esc(p[0])+' · ':'')+tot+' urnas · empacadas '+emp+'</span></div>';
    ids.forEach(function(i){
      var l=S.datos.lotes[i];
      r+='<button class="lote" onclick="detalle('+i+')"><b>'+esc(corto(l.folio))+'</b>'+tagEstado(l.estado)+
         '<span>'+l.cantidad+' piezas</span></button>';
    });
    return r;
  };
  var ocAnt=null;
  activas.forEach(function(k){
    var oc=k.split('|')[0];
    if(oc!==ocAnt){ h+='<div class="oc pedido">PEDIDO '+esc(oc)+'</div>'; ocAnt=oc; }
    h+=pintarSemana(k,false);
  });
  if(listas.length){
    if(!activas.length) h+='<div class="card">🎉 Todas las semanas de estos lotes ya están terminadas.</div>';
    h+='<details class="hechas"><summary>✔ Semanas terminadas ('+listas.length+') <small>toca para ver</small></summary>'+listas.map(function(k){ return pintarSemana(k,true); }).join('')+'</details>';
  }
  $('listaLotes').innerHTML = h || (miArea()!=='Todas' && !S.verTodo ? '<div class="card">🎉 No hay lotes pendientes para <b>'+miArea()+'</b>. Toca <b>Todos</b> para ver el resto.</div>' : '<div class="card">No hay lotes con ese nombre. Revisa que el pedido esté <b>Activo</b> o toca "Actualizar datos".</div>');
}

/* ---------- empacado ---------- */
function semanaHoy(oc, fecha){
  var p=(S.datos.pedidos||[]).filter(function(x){ return x.oc===oc; })[0];
  if(!p || !p.inicio) return '';
  var i=new Date(p.inicio), d=fecha?new Date(fecha):new Date();
  var a=Date.UTC(i.getFullYear(),i.getMonth(),i.getDate()), b=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  return Math.max(1, Math.floor(Math.round((b-a)/86400000)/7)+1);
}
function lotesDe(r){
  return S.datos.lotes.filter(function(l){ return l.oc===r.oc && l.modelo===r.modelo && (l.color===r.color || (!r.color && (l.color==='—'||!l.color))); })
    .sort(function(a,b){ var na=+(a.folio.match(/#(\d+)/)||[0,0])[1], nb=+(b.folio.match(/#(\d+)/)||[0,0])[1]; return na-nb; });
}
/* Reparte la cantidad en los lotes del modelo, en orden (#1, #2…) */
function repartir(r, cant){
  var res=[], resto=cant;
  lotesDe(r).forEach(function(l){
    var falta=l.cantidad-Math.min(l.empacadas||0,l.cantidad);
    if(resto<=0 || falta<=0) return;
    var toma=Math.min(falta,resto); res.push({lote:l, toma:toma, falta:falta}); resto-=toma;
  });
  return {partes:res, sobra:resto};
}
function empacado(oc){
  var ocs=(S.datos.ocs||[]); S.ocEmp=oc||S.ocEmp||ocs[0];
  if(ocs.indexOf(S.ocEmp)<0) S.ocEmp=ocs[0];
  var h='<button class="back" onclick="lotes()">← Lotes</button><h2>📦 Empacado</h2><p class="sub">Registra las urnas que empacaste para entregar</p>';
  if(ocs.length>1){ h+='<label>Pedido</label><div class="seg">'; ocs.forEach(function(o){ h+='<button class="'+(o===S.ocEmp?'on':'')+'" onclick="empacado(\''+esc(o)+'\')">'+esc(o)+'</button>'; }); h+='</div>'; }
  var items=(S.datos.renglones||[]).filter(function(r){ return r.oc===S.ocEmp; }).map(function(r,i){
    var falta=Math.max(0,r.aProducir-r.empacadas);
    return {val:r, titulo:r.desc||r.modelo, sub:r.codigo+' · empacadas '+r.empacadas+' de '+r.aProducir+(falta?'':' ✔'), extra:r.modelo+' '+r.color};
  });
  var sem=semanaHoy(S.ocEmp);
  h+='<label>¿Qué modelo empacaste?</label>'+buscador('mod','Escribe: casa, clásica, chocolate…',items)+
     '<label>¿Cuántas empacaste?</label>'+stepper('cant',0)+
     '<div id="pista" class="pista"></div>'+
     (sem?'<div class="sub" style="margin-top:8px">Se entrega en la <b>Semana '+sem+'</b> del pedido '+esc(S.ocEmp)+'</div>':'')+
     '<label>Comentario (opcional)</label><input type="text" id="com" maxlength="200">';
  if(S.papel) h+=quienHtml()+'<label>Fecha y hora (de la hoja de papel)</label><input type="datetime-local" id="fh" value="'+ahoraLocal()+'">';
  h+='<div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarEmpacado()">✔ Registrar</button></div>';
  pantalla(h);
  S.pick.mod.alElegir=function(x){ $('cant').value=0; pista(); };
  S.alCambiar=pista; $('cant').oninput=pista;
}
function pista(){
  var x=elegido('mod'), el=$('pista'); if(!el) return;
  if(!x){ el.innerHTML=''; return; }
  var cant=parseInt($('cant').value,10)||0;
  if(cant<=0){ var r0=repartir(x.val,1e9).partes[0]; el.innerHTML = r0 ? '<div class="sub">Este modelo va en el lote <b>'+esc(corto(r0.lote.folio))+'</b> (Semana '+esc(r0.lote.semana)+').</div>' : ''; return; }
  var rp=repartir(x.val,cant), p=rp.partes, h='';
  if(!p.length) h='<div class="warn">Este modelo ya no tiene lotes pendientes de empacar. Si son extras o reposiciones, escríbelo en el comentario.</div>';
  else {
    var a=p[0], n=a.lote.folio, s=' (Semana '+esc(a.lote.semana)+')';
    if(p.length===1 && a.toma===a.falta) h='<div class="ok-lote">✅ Con esto se completa el lote <b>'+esc(corto(n))+'</b>'+s+'</div>';
    else if(p.length===1) h='<div class="ok-lote parcial">Van para el lote <b>'+esc(corto(n))+'</b>'+s+'. Faltarán <b>'+(a.falta-a.toma)+'</b> para completarlo.</div>';
    else h='<div class="ok-lote">✅ Completa el lote <b>'+esc(corto(n))+'</b>'+s+' y '+p.slice(1).map(function(q){ return '<b>'+q.toma+'</b> van al lote <b>'+esc(corto(q.lote.folio))+'</b> (Semana '+esc(q.lote.semana)+')'; }).join(', ')+'.</div>';
    if(rp.sobra>0) h+='<div class="warn">'+rp.sobra+' son más de lo que falta por empacar de este modelo. Revisa la cantidad.</div>';
  }
  el.innerHTML=h;
}
function guardarEmpacado(){
  var x=elegido('mod'), cant=parseInt($('cant').value,10)||0;
  if(!x){ $('err').textContent='Elige el modelo que empacaste.'; return; }
  if(cant<=0){ $('err').textContent='Escribe cuántas empacaste (más de 0).'; return; }
  var r=x.val, rp=repartir(r,cant);
  var fecha=fechaRegistro();
  var rec={ id:uid(), tipo:'empacado', nombre:S.nombre, ts:fecha, oc:r.oc, codigo:r.codigo, desc:r.desc, cantidad:cant,
            lote:rp.partes.map(function(q){ return q.lote.folio; }).join(', '), semana:semanaHoy(r.oc,fecha), comentario:$('com').value.trim() };

/* Entrada del almacén para un modelo+color (por su código de catálogo) */

function guardarTerminado(){

/* Fases que aplican a este lote (sin las de techo si el modelo no lleva techo) */
/* Nombre de la fase como lo ve el trabajador: sin el número ("01 - ") ni "(si lleva)" */
function nomFase(f){ return String(f||'').replace(/^\s*\d+\s*-\s*/,'').replace(/\s*\(si lleva\)\s*/i,'').trim(); }
/* ¿Esta fase solo aplica a modelos con techo? (marcada en Áreas o con "(si lleva)" / "techo" en el nombre) */
function esFaseTecho(pieza,f){
  if(/\(si lleva\)|techo/i.test(f)) return true;
  return (S.datos.areasFases||[]).some(function(e){ return e.pieza===pieza && e.fase===f && e.techo; });
}
function fasesDe(l,pieza){
  var lista=S.datos.fases[pieza]||[];
  if(pieza!=='Techo' && !l.techo) lista=lista.filter(function(f){ return !esFaseTecho(pieza,f); });
  if(S.datos.faseEmpaque) lista=lista.filter(function(f){ return f!==S.datos.faseEmpaque; });
  if(areaFases()!=='Todas'){ var a=areaFases(); var sol=lista.filter(function(f){ var x=areaDeFase(pieza,f); return !x || x===a; }); lista=sol; }
  return lista;
}
function sugerida(l,pieza){
  var todas=S.datos.fases[pieza]||[], lista=fasesDe(l,pieza), act=todas.indexOf(l.av[pieza]);
  if(act<0) return lista[0];
  for(var k=0;k<lista.length;k++){ if(todas.indexOf(lista[k])>act) return lista[k]; }
  return lista[lista.length-1];
}

/* ---------- registro rápido: "Terminé <área>" ----------
   El trabajador solo dice que terminó su área en el lote; la app calcula hasta qué fase llegó cada pieza:
   desde la fase en que va, el siguiente bloque seguido de fases de esa área (pestaña Áreas). */
function fasesBase(l,pieza){
  if(pieza==='Techo' && !l.techo) return [];
  var lista=S.datos.fases[pieza]||[];
  if(pieza!=='Techo' && !l.techo) lista=lista.filter(function(f){ return !esFaseTecho(pieza,f); });
  if(S.datos.faseEmpaque) lista=lista.filter(function(f){ return f!==S.datos.faseEmpaque; });
  return lista;
}
function bloque(l,pieza,area){
  var lista=fasesBase(l,pieza), j=lista.indexOf(l.av[pieza])+1;
  while(j<lista.length && areaDeFase(pieza,lista[j])!==area) j++;
  if(j>=lista.length) return null;
  var k=j; while(k+1<lista.length && areaDeFase(pieza,lista[k+1])===area) k++;
  return {desde:lista[j], hasta:lista[k], n:k-j+1};
}
function itemsArea(l,area){
  return PIEZAS.map(function(p){ var b=bloque(l,p[0],area); return b?{pieza:p[0], nom:p[1], b:b}:null; }).filter(Boolean);
}
/* Registro por fase (el registro rápido por área quedó desactivado a petición del dueño) */
function detalle(i,pieza){ return detalleFase(i,pieza); }
function detalleRapido(i,pieza){

  S.rapido=ops;
  var h='<button class="back" onclick="lotes()">← Lotes</button><h2>'+esc(corto(l.folio))+'</h2><p class="sub">'+l.cantidad+' piezas · pedido '+esc(l.oc)+' · '+tagEstado(l.estado)+'</p>';
  if(!ops.length) h+='<div class="card">✅ '+(miArea()!=='Todas'?'Tu área ya terminó todo lo de este lote.':'Este lote ya pasó por todas las fases.')+'</div>';

function terminarArea(i,k){

    function(){ encolar(rec, corto(l.folio)+' · Terminé '+o.area+' · '+l.cantidad+' piezas', 'avance'); },
    { titulo:'¿Terminaste '+o.area+'?', sub:'Revisa que sea el lote correcto', si:'✔ Sí, terminé' });
}
/* ---------- orden de las fases (por cantidades) ----------
   Una fase solo se puede registrar con las piezas que ya terminaron la fase anterior.
   La primera fase, hasta la cantidad del lote. */
function hecho(l,pieza,fase){ var h=S.datos.hechas; return (h&&h[l.folio]&&h[l.folio][pieza]&&h[l.folio][pieza][fase])||0; }
function previa(l,pieza,fase){ var b=fasesBase(l,pieza), i=b.indexOf(fase); return i>0?b[i-1]:null; }

function disponible(l,pieza,fase){
  if(!ORDEN_BLOQUEO || !S.datos.hechas) return Infinity;
  var b=fasesBase(l,pieza), i=b.indexOf(fase); if(i<0) return Infinity;
  var lim = i===0 ? l.cantidad : hecho(l,pieza,b[i-1]);

}
function sumarHecho(folio,pieza,fase,cant){

  h[folio]=h[folio]||{}; h[folio][pieza]=h[folio][pieza]||{}; h[folio][pieza][fase]=(h[folio][pieza][fase]||0)+cant;

  var h='<button class="back" onclick="lotes()">← Lotes</button>'+
    '<div class="lotebox"><div class="lb-nom">'+esc(corto(l.folio))+'</div><div class="lb-sem">SEMANA '+esc(l.semana)+' · '+l.cantidad+' piezas · '+esc(l.oc)+'</div></div>';
  h+='<label class="paso"><i>1</i>¿Qué pieza?</label><div class="seg piezas">';
  piezasOk.forEach(function(p){
    var base=fasesBase(l,p[0]), a=l.av[p[0]], fin=base.length && a===base[base.length-1];
    var est=(!a||a==='—')?'sin iniciar':(fin?'✔ terminada':'va en '+nomFase(a));
    h+='<button class="'+(S.pieza===p[0]?'on':'')+'" onclick="detalleFase('+i+',\''+p[0]+'\')">'+p[1]+'<small>'+esc(est)+'</small></button>';
  });
  h+='</div>';
  var lista=fasesDe(l,S.pieza), base=fasesBase(l,S.pieza), act=l.av[S.pieza], ci=base.indexOf(act);

  /* siguiente fase de su área después de la fase en que va la pieza */

  S.sinFase=!sug && !yaTodo;
  h+='<label class="paso"><i>2</i>¿Qué fase terminaste?</label>';
  if(sug){
    var d0=disponible(l,S.pieza,sug);
    h+='<div class="fasebox" id="faseBox"><span>Siguiente fase</span><b id="faseNom">'+esc(nomFase(sug))+'</b>'+

       '<button class="link" id="otraBtn" onclick="otraFase()">Elegir otra fase ▾</button>';
  } else if(yaTodo){
    h+='<div class="card">✔ '+(areaFases()!=='Todas'?'Tu área ya registró todas sus fases de esta pieza.':'Esta pieza ya tiene registradas todas sus fases.')+' Si es otra tanda, elige la fase:</div>';
  } else {
    var bloq=base.filter(function(f){ return disponible(l,S.pieza,f)>0; })[0];
    h+='<div class="card bloqueo">🔒 '+(termino&&!bloq?'Esta pieza ya terminó todas sus fases en este lote.':
       bloq?'Todavía no puedes registrar. Primero se tiene que registrar <b>'+esc(nomFase(bloq))+'</b>'+(areaDeFase(S.pieza,bloq)&&areaDeFase(S.pieza,bloq)!==areaFases()?' ('+esc(areaDeFase(S.pieza,bloq))+')':'')+'.':

function guardarAvance(){
  var cant=parseInt($('cant').value,10)||0, dan=parseInt($('dan').value,10)||0;
  if(cant<=0){ $('err').textContent='Escribe cuántas piezas pasaron (más de 0) o toca "Todo el lote".'; return; }
  var l=S.lote, pz=(PIEZAS.filter(function(p){ return p[0]===S.pieza; })[0]||[0,S.pieza])[1];
  var fase=$('fase').value;
  var rec={ id:uid(), tipo:'avance', nombre:S.nombre, ts:fechaRegistro(), folio:l.folio, pieza:S.pieza,
            fase:fase, cantidad:cant, danadas:dan, comentario:$('com').value.trim() };
  /* Orden de fases: no se puede registrar más de lo que ya terminó la fase anterior */
  var disp=disponible(l,S.pieza,fase), pv=previa(l,S.pieza,fase);
  if(isFinite(disp) && cant>disp){
    $('err').textContent = disp<=0 ? (pv?'Primero se tiene que registrar '+nomFase(pv)+'.':'Esta fase ya está completa en este lote.')
                                  : 'Solo puedes registrar hasta '+disp+(pv?': son las piezas que ya terminaron '+nomFase(pv)+'.':': es el tamaño del lote.');
    return;
  }
  /* Revisiones para evitar errores comunes (si no hay datos de cantidades) */
  var base=fasesBase(l,S.pieza), act=l.av[S.pieza], ci=base.indexOf(act), fi=base.indexOf(fase), av=[];
  if(cant>l.cantidad) av.push('Pusiste '+cant+' y el lote es de '+l.cantidad+'.');
  if(!isFinite(disp) && ci>=0 && fi>=0 && fi<=ci) av.push(nomFase(fase)+' ya estaba registrada (esta pieza va en '+nomFase(act)+'). ¿Es otra tanda del mismo lote?');
  if(!isFinite(disp) && fi>ci+1){
    var area=areaDeFase(S.pieza,fase), falta=base.slice(ci+1,fi);
    var txt=falta.slice(0,4).map(function(f){ var a=areaDeFase(S.pieza,f); return nomFase(f)+(a&&area&&a!==area?' ('+a+')':''); }).join(', ')+(falta.length>4?' y '+(falta.length-4)+' más':'');
    av.push('Todavía no se registra: '+txt+'. ¿Seguro que ya terminaste '+nomFase(fase)+'?');
  }
  if(dan>cant) av.push('Pusiste más dañadas ('+dan+') que piezas ('+cant+').');
  preguntar([['Lote',corto(l.folio)+' · Semana '+l.semana],['Pieza',pz],['Fase que terminó',nomFase(fase)],['Piezas que pasaron',cant]].concat(dan?[['Dañadas',dan]]:[]),
    av, function(){ encolar(rec, corto(l.folio)+' · '+pz+' · '+nomFase(fase)+' · '+cant, 'avance'); });
}

function misRegistros(){
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var h=hist().filter(function(x){ return x.t>=hoy.getTime() && (x.nombre===S.nombre || x.por===S.nombre); }).sort(function(a,b){ return b.t-a.t; });
  var html='<button class="back" onclick="menu()">← Inicio</button><h2>🧾 Mis registros de hoy</h2><p class="sub">Si te equivocaste, puedes anular un registro durante los primeros '+minutosAnular()+' minutos. Después, pídeselo al encargado.</p>';
  if(!h.length) html+='<div class="card">Hoy no has registrado nada en este celular.</div>';
  h.forEach(function(x){
    var hora=new Date(x.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    var puede = x.estado==='pendiente' || (x.estado==='enviado' && (esAdmin() || Date.now()-x.t < minutosAnular()*60000));
    var tag={pendiente:'<span class="tag t-Sin">sin enviar</span>',enviado:'<span class="tag t-Ter">enviado</span>',anulado:'<span class="tag t-Atr">anulado</span>',rechazado:'<span class="tag t-Atr">no se guardó</span>'}[x.estado]||'';
    html+='<div class="card reg'+(x.estado==='anulado'?' tachado':'')+'"><div><b>'+esc(hora)+'</b> '+tag+'<br>'+esc(x.resumen)+'</div>'+
          (puede?'<button class="bR chico" onclick="anularReg(\''+x.id+'\')">Anular</button>':'')+'</div>';
  });
  pantalla(html);
}
function anularReg(id, alTerminar){
  var x=hist().filter(function(r){ return r.id===id; })[0];
  if(!x){ var u=((S.panelDatos&&S.panelDatos.ultimos)||[]).filter(function(r){ return r.id===id; })[0]; x={resumen:u?u.nombre+' · '+u.texto:'Registro', id:id, estado:'enviado'}; }
  preguntar([['Registro',x.resumen]], ['Se va a borrar de la hoja como si nunca se hubiera registrado.'], function(){
    if(x.estado==='pendiente' && cola().some(function(r){ return r.id===id; })){
      setCola(cola().filter(function(r){ return r.id!==id; })); histMarcar(id,'anulado'); cargarDatos(function(){}); (alTerminar||misRegistros)(); return;
    }
    if(!enLinea && !navigator.onLine){ alert('Necesitas internet para anular un registro que ya se envió.'); return; }
    pantalla('<p>Anulando…</p>');
    google.script.run
      .withSuccessHandler(function(){ histMarcar(id,'anulado'); cargarDatos(function(){ (alTerminar||misRegistros)(); }); })
      .withFailureHandler(function(err){ alert('No se pudo anular: '+String(err&&err.message||err).replace(/^SIN_RED:.*/,'no hay internet')); (alTerminar||misRegistros)(); })
      .anular({ id:id, nombre:S.nombre, firma:S.firma });
  }, { titulo:'¿Anular este registro?', sub:'Revisa que sea el correcto', si:'🗑 Sí, anular', no:'Cancelar', peligro:true });
}

/* ---------- reportar un problema (con foto) ---------- */
var TIPOS_PROBLEMA=['Pieza dañada','Falta material','Máquina o herramienta','Otro'];
function problema(){
  S.foto=null; S.tipoProb=S.tipoProb||TIPOS_PROBLEMA[0];
  var h='<button class="back" onclick="menu()">← Inicio</button><h2>⚠️ Reportar un problema</h2><p class="sub">Le llega un aviso al encargado</p><label>¿Qué pasó?</label><div class="seg">';
  TIPOS_PROBLEMA.forEach(function(t){ h+='<button class="'+(S.tipoProb===t?'on':'')+'" onclick="S.tipoProb=\''+t+'\';[].forEach.call(document.querySelectorAll(\'#tp button\'),function(b){b.className=b.textContent===\''+t+'\'?\'on\':\'\';})">'+esc(t)+'</button>'; });
  h=h.replace('<div class="seg">','<div class="seg" id="tp">');
  h+='</div><label>¿En qué lote? (opcional)</label><select id="plote"><option value=""></option>';
  (S.datos.lotes||[]).forEach(function(l){ h+='<option value="'+esc(l.folio)+'">'+esc(corto(l.folio))+'</option>'; });
  h+='</select><label>Describe el problema</label><textarea id="pdesc" rows="3" maxlength="500" placeholder="Ej. 5 tapas salieron con el MDF despostillado"></textarea>'+
     '<label>Foto (opcional)</label><label class="foto"><input type="file" accept="image/*" capture="environment" onchange="leerFoto(this)">📷 Tomar o elegir foto</label><div id="pfoto"></div>'+
     '<div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarProblema()">✔ Enviar reporte</button></div>';
  pantalla(h);
}
/* Achica la foto para que no pese (máx. 1280 px) */
function leerFoto(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var M=1280, w=img.width, h=img.height, k=Math.min(1,M/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.foto=c.toDataURL('image/jpeg',0.7);
      $('pfoto').innerHTML='<img src="'+S.foto+'" style="max-width:100%;border-radius:12px;margin-top:8px"><button class="link" onclick="S.foto=null;$(\'pfoto\').innerHTML=\'\'">Quitar foto</button>';
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function guardarProblema(){
  var d=$('pdesc').value.trim(), lote=$('plote').value;
  if(!d){ $('err').textContent='Escribe qué pasó.'; return; }
  preguntar([['Tipo',S.tipoProb]].concat(lote?[['Lote',corto(lote)]]:[]).concat([['Descripción',d.length>60?d.slice(0,60)+'…':d],['Foto',S.foto?'Sí':'No']]), [], function(){
    encolar({ id:uid(), tipo:'problema', nombre:S.nombre, ts:fechaRegistro(), tipoProblema:S.tipoProb, lote:lote, descripcion:d, foto:S.foto||'' }, 'Problema: '+S.tipoProb+' · '+d.slice(0,40), 'problema');
  }, { sub:'Revisa el reporte', si:'✔ Sí, enviar' });
}

/* ---------- entrada de material al almacén (encargado) ---------- */
function entrada(area){
  S.almMov='Entrada';
  S.area=area||S.area||'Pintura';
  if(!esAdmin()){ S.almMov='Salida'; return almacen(null,'Salida'); }
  var items=articulos().map(function(x,i){ return {val:i, titulo:x.nombre, sub:'Hay '+x.existencia+' '+x.unidad, extra:x.codigo, nivel:NIVEL[x.estado], queda:x.existencia+' '+x.unidad}; });
  var h='<button class="back" onclick="'+(S.desdeEnc?'vistaEncargado()':'menu()')+'">← '+(S.desdeEnc?'Vista de encargado':'Inicio')+'</button><h2>🎨 Almacén de pintura y ferretería</h2>'+segMovAlm()+'<p class="sub">🔑 Entrada al almacén (solo encargado)</p><label>¿De qué almacén?</label><div class="seg">';
  ['Pintura','Ferretería'].forEach(function(a){ h+='<button class="'+(S.area===a?'on':'')+'" onclick="entrada(\''+a+'\')">'+(a==='Pintura'?'🎨 ':'🔩 ')+a+'</button>'; });
  h+='</div><label>¿Qué material llegó?</label>'+buscador('art','Escribe: laca, lija, thinner…',items)+
     '<label>¿Cuánto llegó?</label>'+stepper('cant',0)+
     '<label>Proveedor / factura (opcional)</label><input type="text" id="prov" maxlength="120" placeholder="Ej. Comex F-1234">';
  h+='<div id="err" class="err"></div><div class="btnrow"><button class="b3" onclick="guardarEntrada()">✔ Registrar entrada</button></div>';
  pantalla(h);
}
function guardarEntrada(){
  var sel=elegido('art'), x=sel?articulos()[sel.val]:null, cant=parseFloat($('cant').value)||0, prov=$('prov').value.trim();
  if(!x){ $('err').textContent='Elige el material que llegó.'; return; }
  if(cant<=0){ $('err').textContent='Escribe cuánto llegó (más de 0).'; return; }
  preguntar([['Material',x.nombre],['Llegó',cant+' '+x.unidad]].concat(prov?[['Proveedor / factura',prov]]:[]), [], function(){
    x.existencia=Math.round((x.existencia+cant)*100)/100;
    if(x.min!=null && x.alerta!=null) x.estado = x.existencia<=x.min ? 'CRÍTICO' : (x.existencia<=x.alerta ? 'POR AGOTARSE' : 'ESTABLE');
    guardar('datos',S.datos);
    encolar({ id:uid(), tipo:'entrada', nombre:S.nombre, ts:fechaRegistro(), area:S.area, articulo:x.op, codigo:x.codigo, nombreArt:x.nombre, cantidad:cant, proveedor:prov }, 'Entrada: '+x.nombre+' · '+cant+' '+x.unidad, 'entrada');
  });
}

/* ---------- vista de encargado (solo administradores) ----------
   No aparece en el menú: se abre tocando 3 veces seguidas el título "Producción de urnas".
   Si quien está en la app no es encargado, no pasa nada. */
var TOQUES=[];
function toqueTitulo(){
  var t=Date.now(); TOQUES=TOQUES.filter(function(x){ return t-x<1500; }); TOQUES.push(t);
  if(TOQUES.length>=3){ TOQUES=[]; if(S.datos && S.nombre && esAdmin()) vistaEncargado(); }

/* ---------- vista de encargado (solo administradores) ---------- */

    '<button class="big b2" onclick="progresoAreas()">📈<span>Progreso por área<small>Corte, Lijado, Pintura y Empacado de cada pedido, por semana y por lote</small></span></button>'+

/* Pide al servidor los registros y problemas (necesita internet) */
function cargarPanel(titulo, pintar){

function anularRegistros(){ cargarPanel('🧾 Anular registros', registrosHtml); }

function filtrarRegs(){

  (d.ultimos||[]).filter(function(r){ return !q || r.nombre===q; }).forEach(function(r){
    h+='<div class="card reg"><div><small>'+esc(r.cuando)+' · '+esc(r.nombre)+'</small><br>'+esc(r.texto)+'</div><button class="bR chico" onclick="anularReg(\''+esc(r.id)+'\', anularRegistros)">Anular</button></div>';
  });

function problemasEnc(){ cargarPanel('⚠️ Problemas reportados', problemasHtml); }
function problemasHtml(d){
  var ps=d.problemas||[];
  if(!ps.length) return '<div class="card">No hay problemas pendientes 👍</div>';
  return '<p class="sub">Pendientes ('+ps.length+'). Cuando ya esté arreglado, márcalo como resuelto.</p>'+ps.map(function(p){
    return '<div class="card"><small>'+esc(p.fecha)+' · '+esc(p.quien)+' · '+esc(p.tipo)+(p.lote?' · '+esc(corto(p.lote)):'')+'</small><br>'+esc(p.desc)+
      (/^https?:/.test(p.foto)?'<br><a href="'+esc(p.foto)+'" target="_blank" rel="noopener">📷 Ver foto</a>':(p.foto?'<br><small>📷 La foto está en tu correo</small>':''))+
      '<div class="btnrow"><button class="b3" onclick="resolverProb(\''+esc(p.id)+'\')">✔ Marcar resuelto</button></div></div>';
  }).join('');
}
/* Avance de un grupo de lotes en cada área (0 a 1), ponderado por cantidad */
function avanceGrupo(ls){
  var t=0, r={Corte:0,Lijado:0,Pintura:0,Empacado:0};
  ls.forEach(function(l){ var a=avanceLote(l); t+=l.cantidad; AREAS.forEach(function(k){ r[k]+=a[k]*l.cantidad; }); r.Empacado+=Math.min(l.empacadas||0,l.cantidad); });
  if(t) Object.keys(r).forEach(function(k){ r[k]/=t; });
  r.urnas=t; return r;
}
function barras(a, chico){
  return AREAS.concat(['Empacado']).map(function(k){
    var p=Math.round(a[k]*100);
    return '<div class="av-fila"'+(chico?' style="font-size:12px;margin:3px 0"':'')+'><span class="av-nom">'+k+'</span><span class="av-barra"'+(chico?' style="height:9px"':'')+'><i style="width:'+p+'%;background:'+COLOR_AREA[k]+'"></i></span><span class="av-pct">'+p+'%</span></div>';
  }).join('');
}
function progresoAreas(){
  if(!esAdmin()) return menu();
  var h='<button class="back" onclick="vistaEncargado()">← Vista de encargado</button><h2>📈 Progreso por área</h2><p class="sub">Según la última fase registrada de cada pieza. Empacado = urnas empacadas.</p>';
  var ocs=S.datos.ocs||[];
  if(!ocs.length) h+='<div class="card">No hay pedidos activos.</div>';
  ocs.forEach(function(oc){
    var ls=S.datos.lotes.filter(function(l){ return l.oc===oc; }); if(!ls.length) return;
    var a=avanceGrupo(ls), atr=ls.filter(function(l){ return l.estado==='Atrasado'; }).length;
    h+='<div class="card avance"><div class="av-tit">Pedido <b>'+esc(oc)+'</b> · '+a.urnas+' urnas · '+ls.length+' lotes'+(atr?' · <span style="color:#b00020">'+atr+' atrasado(s)</span>':'')+'</div>'+barras(a)+'</div>';
    var sems={}; ls.forEach(function(l){ (sems[l.semana]=sems[l.semana]||[]).push(l); });
    var lista=function(sm){ return sems[sm].every(function(l){ return l.estado==='Terminado' || (l.empacadas||0)>=l.cantidad; }); };
    Object.keys(sems).sort(function(x,y){ return (lista(x)-lista(y)) || ((Number(x)||0)-(Number(y)||0)); }).forEach(function(sm){
      var g=sems[sm], ag=avanceGrupo(g), ok=lista(sm);
      h+='<div class="card'+(ok?' sem-ok':'')+'"><b>'+(ok?'✔ ':'')+'Semana '+esc(sm)+(ok?' · terminada':'')+'</b> <span class="sub">· '+ag.urnas+' urnas</span>'+barras(ag,true)+
         '<details style="margin-top:6px"><summary class="sub">Ver cada lote ('+g.length+')</summary>'+
         g.map(function(l){ var al=avanceLote(l), e=Math.round(Math.min(l.empacadas||0,l.cantidad)/(l.cantidad||1)*100);
           return '<div style="margin-top:8px"><b style="font-size:13px">'+esc(corto(l.folio))+'</b> '+tagEstado(l.estado)+'<div class="mini" style="font-size:12px">'+
             AREAS.map(function(k){ return '<em style="font-style:normal;margin-right:8px;color:'+COLOR_AREA[k]+'">'+k+' '+Math.round(al[k]*100)+'%</em>'; }).join('')+
             '<em style="font-style:normal;color:'+COLOR_AREA.Empacado+'">Empacado '+e+'%</em></div></div>'; }).join('')+
         '</details></div>';
    });
  });
  pantalla(h);
}
/* ---------- panel del encargado ---------- */
function panelEncargado(){
  if(!esAdmin()) return menu();
  var h='<button class="back" onclick="vistaEncargado()">← Vista de encargado</button><h2>📊 Panel del encargado</h2>'+barrasAvance();

  var cortar=Object.keys(S.datos.estante||{}).filter(function(k){ return S.datos.estante[k].estado==='CORTAR YA'; });
  h+='<div class="card"><b>🔴 Piezas que hay que cortar ya ('+cortar.length+')</b><br>'+(cortar.length?cortar.slice(0,25).map(esc).join('<br>')+(cortar.length>25?'<br>…':''):'<span class="sub">Ninguna 👍</span>')+'</div>';
  if(S.datos.almacen){
    var rojo=[], amar=[];
    Object.keys(S.datos.almacen).forEach(function(a){ S.datos.almacen[a].forEach(function(x){ if(x.estado==='CRÍTICO') rojo.push(x); else if(x.estado==='POR AGOTARSE') amar.push(x); }); });
    h+='<div class="card"><b>🛒 Material para comprar</b><br>'+(rojo.length||amar.length?rojo.map(function(x){ return '🔴 '+esc(x.nombre)+' <small>(quedan '+x.existencia+' '+esc(x.unidad)+')</small>'; }).concat(amar.map(function(x){ return '🟡 '+esc(x.nombre)+' <small>(quedan '+x.existencia+' '+esc(x.unidad)+')</small>'; })).join('<br>'):'<span class="sub">Todo bien de existencia 👍</span>')+'</div>';
  }
  h+='<div id="panelSrv"><p class="sub">Cargando registros y problemas…</p></div>';

  google.script.run
    .withSuccessHandler(function(d){ if($('panelSrv')) $('panelSrv').innerHTML=panelSrvHtml(d); })
    .withFailureHandler(function(err){ if($('panelSrv')) $('panelSrv').innerHTML='<div class="card">Sin internet: no se pueden ver los registros del día ni los problemas.<br><small>'+esc(String(err&&err.message||err).replace(/^SIN_RED:\s*/,''))+'</small></div>'; })
    .panel({ nombre:S.nombre, firma:S.firma });
}
function panelSrvHtml(d){
  var h='';
  h+='<div class="card"><b>👥 Registros de hoy</b><br>'+(Object.keys(d.registrosHoy||{}).map(function(n){ return esc(n)+': '+d.registrosHoy[n]; }).join(' · ')||'<span class="sub">Nadie ha registrado hoy</span>')+
     (d.sinRegistro&&d.sinRegistro.length?'<div class="warn" style="margin-top:8px">Sin registrar hoy: '+d.sinRegistro.map(esc).join(', ')+'</div>':'')+'</div>';
  h+='<div class="card"><b>⚠️ Problemas sin resolver ('+(d.problemas||[]).length+')</b>';
  (d.problemas||[]).forEach(function(p){
    h+='<div class="prob"><small>'+esc(p.fecha)+' · '+esc(p.quien)+' · '+esc(p.tipo)+(p.lote?' · '+esc(corto(p.lote)):'')+'</small><br>'+esc(p.desc)+
       (/^https?:/.test(p.foto)?'<br><a href="'+esc(p.foto)+'" target="_blank" rel="noopener">📷 Ver foto</a>':(p.foto?'<br>📷 Foto en tu correo':''))+
       '<br><button class="link" onclick="resolverProb(\''+esc(p.id)+'\')">✔ Marcar resuelto</button></div>';
  });
  if(!(d.problemas||[]).length) h+='<br><span class="sub">Ninguno 👍</span>';
  h+='</div><div class="card"><b>🧾 Últimos registros</b><p class="sub" style="margin:4px 0">Puedes anular cualquiera si está mal.</p>';
  (d.ultimos||[]).forEach(function(r){
    h+='<div class="reg"><div><small>'+esc(r.cuando)+' · '+esc(r.nombre)+'</small><br>'+esc(r.texto)+'</div><button class="bR chico" onclick="anularReg(\''+esc(r.id)+'\', panelEncargado)">Anular</button></div>';
  });
  return h+'</div>';
}
function resolverProb(id){
  google.script.run.withSuccessHandler(function(){ problemasEnc(); }).withFailureHandler(function(e){ alert('No se pudo: '+String(e&&e.message||e)); }).resolver({ id:id, nombre:S.nombre, firma:S.firma });
}

/* ---------- modo oscuro: Automático (como el celular) / Oscuro / Claro ---------- */
var TEMAS={auto:'🌗 Tema: automático', oscuro:'🌙 Tema: oscuro', claro:'☀️ Tema: claro'};
function aplicarTema(){
  var t=leer('tema','auto'), sis=window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  var osc = t==='oscuro' || (t==='auto' && sis);
  document.body.classList.toggle('oscuro', osc);
  var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', osc?'#0f172a':'#1c4587');
}
function cambiarTema(){ var orden=['auto','oscuro','claro'], t=leer('tema','auto'); guardar('tema', orden[(orden.indexOf(t)+1)%3]); aplicarTema(); menu(); }
if(window.matchMedia){ var mq=matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change',aplicarTema); else if(mq.addListener) mq.addListener(aplicarTema); }
aplicarTema();

/* ---------- arranque ---------- */
pintarEstado();
cargarDatos(function(){ inicio(); enviarPendientes(); });
